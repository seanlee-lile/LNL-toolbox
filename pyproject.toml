[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lnl-toolbox"
version = "0.1.0"
description = "A reproducible research toolbox for learning with noisy labels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "torchvision>=0.17",
    "randaugment==1.0.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.7,<2",
]
dev = [
    "build>=1.2",
    "coverage[toml]>=7.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "tomli; python_version < '3.11'",
]

[project.scripts]
lnl = "lnl_toolbox.cli.main:main"
lnl-clean-train = "lnl_toolbox.cli.clean_train:main"
lnl-inspect-data = "lnl_toolbox.cli.inspect_data:main"
lnl-make-noise = "lnl_toolbox.cli.make_noise:main"
lnl-train = "lnl_toolbox.cli.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lnl_toolbox = ["paper_catalog.json"]
"lnl_toolbox.cli" = ["data/recipe_catalog.json"]
"lnl_toolbox.scratch" = ["recipes/**/*.yaml", "formula/composites/*.yaml", "web/*.html", "web/*.js", "web/*.css"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Initial repository-wide gate: syntax and invalid-control-flow errors.
# Broader style/unused-import enforcement is intentionally ratcheted later.
select = ["E9", "F63", "F7"]

[tool.coverage.run]
source = ["lnl_toolbox"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

