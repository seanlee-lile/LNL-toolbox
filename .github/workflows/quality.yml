name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[train,dev]"
      - run: python -m ruff check src tests
      - run: python -m coverage run -m unittest discover -s tests -v
      - run: python -m coverage report
      - run: python -m unittest discover -s tests -p "test_unified_cli.py" -v
      - run: lnl --help
      - name: Dry-run built-in CIFAR recipe without local data
        run: lnl run cifar10-symmetric-ce-smoke --dry-run --no-check-data

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[train,dev]"
      - run: python -m build
      - run: python -m pip uninstall -y lnl-toolbox
      - run: python -m pip install dist/*.whl
      - run: lnl --help
      - run: lnl list experiments --profile smoke --format tsv
      - run: lnl validate --recipe cifar10-volminnet-smoke
      - run: python -m pip uninstall -y lnl-toolbox
      - run: python -m pip install dist/*.tar.gz
      - run: lnl list experiments --profile smoke --format tsv
      - run: lnl validate --recipe cifar10-volminnet-smoke
