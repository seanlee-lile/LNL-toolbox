name: quality

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests web

  unit-python-3-12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[train,dev]"
      - run: python -m coverage run -m unittest discover -s tests -v
      - run: python -m coverage report

  compatibility-python-3-10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e ".[train]"
      - run: python -c "import lnl_toolbox"
      - run: lnl --help
      - run: lnl list experiments --profile smoke --format tsv
      - run: lnl validate --recipe cifar10-volminnet-smoke

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[train]" "build>=1.2"
      - run: python -m build
      - run: python -m pip uninstall -y lnl-toolbox
      - run: python -m pip install dist/*.whl
      - run: lnl --help
      - run: lnl list experiments --profile smoke --format tsv
      - run: lnl validate --recipe cifar10-volminnet-smoke
      - run: python -m pip uninstall -y lnl-toolbox
      - run: python -m pip install dist/*.tar.gz
      - run: lnl --help
      - run: lnl list experiments --profile smoke --format tsv
      - run: lnl validate --recipe cifar10-volminnet-smoke
