          choices influence the curriculum and are paper-level behavior.
        moving: The paper describes moving-loss statistics and cross-validated percentile-style controls; the exact repository
          fields must be interpreted through its MentorNet adapter.
        artifact: The pretrained MentorNet artifact is method infrastructure and must not be swapped as an ordinary hyperparameter.
