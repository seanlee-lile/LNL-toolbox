registry_version: 1.0.0
generated_for:
  repository: https://github.com/seanlee-lile/LNL-toolbox
  branch: codex/cli
  audit_date: '2026-08-21'
  method_count: 26
  scope: formal paper recipes + WebUI parameter-editing policy
design_contract:
  value_source_of_truth: The selected YAML recipe remains the source of parameter values; this registry is the source of UI
    semantics, permission level, provenance and constraints.
  registry_must_drive:
  - field visibility
  - grouping/expansion
  - read-only state
  - paper provenance tooltip
  - reproduction-impact warning
  - linked-field validation
  - modified_from_paper marker
  paper_parameter_edit_rule: editable, but changing it sets modified_from_paper=true and requires an explicit reproduction-impact
    acknowledgement
  locked_parameter_edit_rule: read-only in ordinary WebUI; modification requires a separate expert/fork workflow, never the
    normal parameter panel
  strict_reproduction_rule: dataset/noise protocol, runner, method/component names, fidelity/variant, model architecture,
    stage handoff and checkpoint/model-selection rules are locked even when represented as scalar strings/numbers
  current_webui_problem: Current backend recursively exposes scalar/list values in editable sections and protects only a small
    leaf-name blacklist; it does not know whether a field is basic, paper, advanced or protocol-locked.
levels:
  basic:
    label_zh: 基础参数
    editable: true
    default_expanded: true
    requires_warning: false
    meaning: 新手可直接修改的训练预算/随机性/常用训练量；修改不应改变算法身份或组件连线。
  paper:
    label_zh: 论文参数
    editable: true
    default_expanded: true
    requires_warning: true
    meaning: 原论文方法本身的重要超参数；UI 必须显示论文依据、当前论文值/复现值以及偏离影响。
  advanced:
    label_zh: 高级参数
    editable: true
    default_expanded: false
    requires_warning: false
    meaning: 工程、优化器细节、数值稳定性、估计器内部细节、资源/日志设置；默认折叠。
  locked:
    label_zh: 锁定参数
    editable: false
    default_expanded: false
    requires_warning: false
    meaning: runner、算法 variant/fidelity/protocol、组件类型、模型/数据/噪声协议、stage wiring、模型选择规则等；只读展示，不能作为普通调参修改。
global_ui_rules:
  default_order:
  - basic
  - paper
  - advanced
  - locked
  basic:
    render: expanded
    badge: 基础
    change_marker: user_modified
  paper:
    render: expanded_with_source
    badge: 论文
    change_marker: modified_from_paper
    show_original_source: true
    show_reproduction_impact: true
  advanced:
    render: collapsed
    badge: 高级
    change_marker: advanced_modified
  locked:
    render: collapsed_readonly
    badge: 锁定
    show_lock_reason: true
  atomic_structures:
  - transition matrices
  - feature layer lists
  - parameter-search provenance records
  - external artifact hashes/fingerprints
  linked_validation_examples:
  - coteaching.noise_rate must stay consistent with the experiment noise condition when strict reproduction is requested
  - cnlcu.noise_rate must stay consistent with the experiment noise condition when strict reproduction is requested
  - cdr parameter_update.noise_rate is algorithm input and must be coordinated with noise.rate
  - binary-risk risk.rho_positive/rho_negative must match the intended noise model rates
webui_migration:
  backend:
  - Replace _EDITABLE_SECTIONS + _PROTECTED_LEAF_NAMES as the authorization source with registry lookup by method + dotted
    path.
  - Return level, editable, default_expanded, provenance, paper source/evidence, impact, constraints and linked_fields in
    /api config schema.
  - Reject patches to locked fields server-side even if a client forges the request.
  - When a paper-level field changes, persist/emit modified_from_paper and changed_from values for the generated YAML/run
    manifest.
  frontend:
  - Render four groups in fixed order; advanced and locked are collapsed by default.
  - Paper group shows the paper title/source plus per-field evidence/impact.
  - Locked controls use readonly text/value display, not disabled form elements that hide values.
  - Show a visible “已偏离论文配置” state after any paper-level change.
