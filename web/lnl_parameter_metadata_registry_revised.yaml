# Presentation only: these paths decide which editable controls are shown by
# default. All other editable controls share one Advanced section; locked
# fields remain read-only. The underlying permission levels are unchanged.
# Basic experiment controls and the selected method's principal parameters
# stay visible. A field's dotted path need not be trainer.epochs/optimizer.lr
# when the formal recipe uses multiple training stages.
# Values required exactly by the current method validators. These are
# implementation contracts, not independently tunable hyperparameters.
# Paired/ranged fields are intentionally absent: they remain editable and
# must pass whole-config validation when saved.
