      audit_scope: method equations/algorithm + hyperparameter/experimental-setting sections checked against the repository
        formal recipe
      evidence:
        mc: MC-LDCE decomposes multi-class loss into label-dependent/independent parts and estimates a clean data centroid
          to obtain an unbiased risk estimator.
        implementation: The repository adds a transition-estimation/fixed-feature lifecycle around the MC-LDCE core; lifecycle
          version, feature mode and estimator family are implementation contracts.
        volume: The transition-estimation auxiliary volume coefficient belongs to the paper-oriented estimator stage but is
          not the defining MC-LDCE loss-decomposition hyperparameter.
