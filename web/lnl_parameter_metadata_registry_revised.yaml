generated_for:
  repository: https://github.com/seanlee-lile/LNL-toolbox
  branch: codex/cli
  audit_date: '2026-08-21'
  method_count: 26
  scope: formal paper recipes + WebUI parameter-editing policy (execution-validity lock rule)
design_contract:
  value_source_of_truth: The selected YAML recipe remains the source of parameter values; this registry is the source of UI
    semantics, permission level, provenance and constraints.
  registry_must_drive:
  - field visibility
  - grouping/expansion
  - read-only state
  - paper provenance tooltip
  - reproduction-impact warning
  - linked-field validation
  - modified_from_paper / modified_from_recipe markers
  permission_principle: Editability and paper fidelity are separate concepts. A value is NOT locked merely because changing
    it deviates from the paper or formal recipe.
  basic_parameter_edit_rule: Editable directly; changing randomness/training controls records the new run settings.
  paper_parameter_edit_rule: Editable. Changing a paper hyperparameter or core paper experiment condition sets modified_from_paper=true
    and shows the reproduction impact/source.
  advanced_parameter_edit_rule: Editable but collapsed by default. This includes supported dataset/noise/model/optimizer/scheduler
    choices, protocol details, numerical/engineering controls and runnable fidelity/variant choices.
  locked_parameter_edit_rule: Read-only only when the field is a structural/runtime/integrity contract or non-parameter provenance
    record. Ordinary paper/protocol deviation is never sufficient reason to lock.
  lock_decision_test: Ask whether an independent edit through the normal parameter panel would invalidate schema/runner/component
    wiring, hard label-space/cardinality/lifecycle contracts, or artifact/provenance integrity. If not, prefer paper/basic/advanced
    rather than locked.
  strict_reproduction_rule: Strict reproduction is a status, not an authorization rule. Editable changes may mark the run
    as modified from the formal recipe, but should not be blocked solely to preserve paper fidelity.
  current_webui_problem: The old policy conflated reproduction fidelity with editability, causing scientifically meaningful
    controls such as Binary Risk noise.rho_positive/noise.rho_negative to appear locked.
levels:
  basic:
    label_zh: 基础参数
    editable: true
    default_expanded: true
    requires_warning: false
    meaning: 新手可直接修改的训练预算/随机性/常用训练量；修改不应破坏 recipe 结构或 runner 契约。
  paper:
    label_zh: 论文参数
    editable: true
    default_expanded: true
    requires_warning: true
    meaning: 论文方法的重要超参数或核心论文实验条件；可修改，UI 必须显示论文来源/影响并标记偏离。
  advanced:
    label_zh: 高级参数
    editable: true
    default_expanded: false
    requires_warning: false
    meaning: 可运行但需要更多理解的选项：数据/噪声/模型/优化器/调度器选择、protocol/fidelity/variant、数值稳定性、估计器细节及工程设置；默认折叠。
  locked:
    label_zh: 锁定参数
    editable: false
    default_expanded: false
    requires_warning: false
    meaning: 仅限结构性运行契约或完整性/provenance 字段；普通参数面板中的独立修改会使配置/组件契约失效或破坏必要完整性。不能仅因为“与论文不同”而锁定。
global_ui_rules:
  default_order:
  - basic
  - paper
  - advanced
  - locked
  basic:
    render: expanded
    badge: 基础
    change_marker: user_modified
  paper:
    render: expanded_with_source
    badge: 论文
    change_marker: modified_from_paper
    show_original_source: true
    show_reproduction_impact: true
  advanced:
    render: collapsed
    badge: 高级
    change_marker: advanced_modified
    show_reproduction_impact: true
    note: advanced 允许修改；若值来自 formal recipe，UI 应提示是否偏离当前 recipe。
  locked:
    render: collapsed_readonly
    badge: 锁定
    show_lock_reason: true
    note: locked 只表示结构/完整性不可由普通参数面板独立修改，不表示“论文默认值不可变”。
  atomic_structures:
  - transition matrices
