# A path appears once in the editor. Values still come from the selected recipe.
research_parameter_view:
  groups:
    method: {label_zh: 方法核心, description_zh: 损失、样本选择、状态更新和论文特有的算法选择。}
    data: {label_zh: 数据与噪声, description_zh: 数据集、划分、标签噪声和输入处理所定义的实验条件。}
    training: {label_zh: 模型与训练, description_zh: 模型、训练预算、优化和调度所定义的对照条件。}
  # Reader-facing categories mirror the desktop research-parameter workbook.
  # They affect only presentation, never config values or edit permissions.
  categories:
    method: {label_zh: 方法核心变量, description_zh: 论文方法中的损失、选择、状态、阶段与估计参数。, default_expanded: true}
