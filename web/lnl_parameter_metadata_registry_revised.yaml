webui_migration:
  backend:
  - Use registry lookup by method + dotted path as the authorization source.
  - Return level, editable, provenance, paper evidence, reproduction impact, constraints and linked_fields.
  - Reject patches only for registry level=locked; do not reject a field merely because it changes paper/protocol fidelity.
  - Validate linked editable fields atomically where the method requires consistency (for example Binary Risk rho values).
  - Emit modified_from_paper / modified_from_recipe state instead of enforcing paper fidelity through read-only controls.
  frontend:
  - Render four groups in fixed order; advanced and locked are collapsed by default.
  - Paper fields are editable and show paper source/current formal value/reproduction impact.
  - Advanced fields are editable; protocol/model/optimizer/fidelity changes should show context rather than a lock.
  - Locked values are readonly and must show a structural/integrity lock reason.
  - Show a visible “已偏离论文/正式 recipe” state after relevant editable changes.
