schema_version: 1
name: binary-risk
description: "Complete Natarajan binary-risk reproduction recipe: synthetic_binary_2d, known asymmetric class-conditional noise, linear classifier, SGD, and 50 epochs."
steps:
  - block: set_seed
    params: {seed: 2013}
  - block: select_device
    params: {device: cpu}
  - {block: load_dataset, params: {dataset: synthetic_binary_2d, options: {train_size: 512, test_size: 2048, data_seed: 2013}}}
  - {block: inspect_dataset_semantics}
  - {block: create_dataset_split, params: {validation_size: 0, split_seed: 2013}}
  - {block: select_label_source}
  - {block: apply_noise, params: {name: binary_asymmetric_rcn, rate: 0.4, seed: 2013, options: {rho_positive: 0.4, rho_negative: 0.4}}}
  - {block: build_noise_manifest}
  - {block: configure_preprocessing, params: {preprocessing: binary_raw, augment: false}}
  - {block: configure_views, params: {views: [weak]}}
  - {block: assign_data_roles, params: {roles: [train, test]}}
  - {block: configure_loader, params: {batch_size: 64, num_workers: 0}}
  - {block: build_prepared_data}
  - {block: build_loaders}
  - block: create_model
    params: {model: linear, input_dim: 2, num_classes: 2, device: device}
  - block: create_optimizer
    params:
      optimizer: sgd
      model: model
      lr: 0.01
      momentum: 0.9
      nesterov: false
      weight_decay: 0.0
  - block: epoch_loop
    params: {epochs: 50}
    steps:
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - {block: zero_grad}
          - {block: forward}
          - block: binary_risk
            params: {rho_positive: 0.4, rho_negative: 0.4, save_as: loss_per_sample}
          - {block: mean_loss}
          - {block: backward}
          - {block: optimizer_step}
      - block: evaluate_accuracy
        params: {model: model, loader: test_loader, save_as: test_accuracy}
  - block: record_metrics
    params: {values: [test_accuracy]}
