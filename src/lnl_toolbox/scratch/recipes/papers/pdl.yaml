schema_version: 1
name: pdl
description: "Complete PDL reproduction: CIFAR-10 IDN-40, 4-epoch warm-up, shared train/validation feature representation, 20-part anchor/basis estimation, 49-epoch correction, 49-epoch T_revision stage, and evaluation."
steps:
  - block: set_seed
    params: {seed: 1}
  - block: select_device
    params: {device: auto}
  - {block: load_dataset, params: {dataset: cifar10}}
  - {block: inspect_dataset_semantics}
  - {block: create_dataset_split, params: {validation_size: 5000, split_strategy: random, split_seed: 1, subset_before_split: true}}
  - {block: select_label_source, params: {validation: observed}}
  - {block: apply_noise, params: {name: pdl, rate: 0.4, seed: 1}}
  - {block: build_noise_manifest}
  - {block: configure_preprocessing, params: {preprocessing: standard, augment: false}}
  - {block: configure_views, params: {views: [weak]}}
  - {block: assign_data_roles, params: {roles: [train, noisy_validation, test]}}
  - {block: configure_loader, params: {batch_size: 128, num_workers: 0, pin_memory: true}}
  - {block: build_prepared_data}
  - {block: build_loaders}
  - block: create_model
    params:
      model: resnet34
      num_classes: 10
      base_width: 64
      stem_padding: 0
      initialization: torch_default
      device: device
      save_as: model
  - block: attach_trainable_head
    params: {model: model, input_dim: 10, output_dim: 10, head_name: T_revision, bias: false}
  - block: create_optimizer
    params:
      optimizer: sgd
      model: model
      lr: 0.01
      momentum: 0.0
      nesterov: false
      weight_decay: 0.0001
      save_as: warmup_optimizer
  - block: epoch_loop
    params: {epochs: 4}
    steps:
      - block: refresh_epoch_loader
        params: {data: prepared_data, role: train, batch_size: 128, save_as: train_loader}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - block: zero_grad
            params: {optimizer: warmup_optimizer}
          - block: forward
            params: {model: model, input: images, save_as: logits}
          - block: per_sample_ce
            params: {logits: logits, labels: labels, save_as: loss_per_sample}
          - block: mean_loss
            params: {input: loss_per_sample, save_as: loss}
          - {block: backward}
          - block: optimizer_step
            params: {optimizer: warmup_optimizer}
      - block: evaluate_accuracy
        params: {model: model, loader: validation_loader, save_as: warmup_validation_accuracy}
      - block: track_best_model
        params: {model: model, metric: warmup_validation_accuracy, metric_name: warmup_validation_accuracy, save_as: best_warmup_state}
  - block: restore_best_model
    params: {model: model, state: best_warmup_state}
  # Snapshot collection is a public model+loader operation.  PDL only
  # assembles the two split snapshots before fitting its representation.
  - block: collect_posterior_snapshot
    params: {model: model, loader: train_loader, device: device, dataset: cifar10, split: train, save_as: pdl_train_posteriors, probabilities_as: pdl_train_posterior_values, targets_as: pdl_train_snapshot_targets, indices_as: pdl_train_snapshot_indices}
  - block: collect_posterior_snapshot
    params: {model: model, loader: validation_loader, device: device, dataset: cifar10, split: noisy_validation, save_as: pdl_validation_posteriors, probabilities_as: pdl_validation_posterior_values, targets_as: pdl_validation_snapshot_targets, indices_as: pdl_validation_snapshot_indices}
  - block: merge_posterior_snapshots
    params: {snapshots: [pdl_train_posteriors, pdl_validation_posteriors], save_as: pdl_representation_posteriors}
  - block: collect_feature_snapshot
    params: {model: model, loader: train_loader, device: device, dataset: cifar10, split: train, save_as: pdl_train_features, features_as: pdl_train_feature_values, targets_as: pdl_train_feature_targets, indices_as: pdl_train_feature_indices}
  - block: collect_feature_snapshot
    params: {model: model, loader: validation_loader, device: device, dataset: cifar10, split: noisy_validation, save_as: pdl_validation_features, features_as: pdl_validation_feature_values, targets_as: pdl_validation_feature_targets, indices_as: pdl_validation_feature_indices}
  - block: merge_feature_snapshots
    params: {snapshots: [pdl_train_features, pdl_validation_features], save_as: pdl_representation_features}
  - block: pdl_fit_part_representation
    params:
      features: pdl_representation_features
      num_parts: 20
      iterations: 10
      error_tolerance: 1.0e-5
      representation_seed: 1
      official_raw: true
  - block: classwise_percentile_anchor_candidates
    params:
      scores: pdl_train_posteriors
      stable_sample_indices: pdl_train_snapshot_indices
      percentiles: [97.0, 97.1052631579, 97.2105263158, 97.3157894737, 97.4210526316, 97.5263157895, 97.6315789474, 97.7368421053, 97.8421052632, 97.9473684211, 98.0526315789, 98.1578947368, 98.2631578947, 98.3684210526, 98.4736842105, 98.5789473684, 98.6842105263, 98.7894736842, 98.8947368421, 99.0]
      save_as: pdl_train_anchor_positions
  - block: classwise_percentile_anchor_candidates
    params:
      scores: pdl_validation_posteriors
      stable_sample_indices: pdl_validation_snapshot_indices
      percentiles: [97.0, 97.1052631579, 97.2105263158, 97.3157894737, 97.4210526316, 97.5263157895, 97.6315789474, 97.7368421053, 97.8421052632, 97.9473684211, 98.0526315789, 98.1578947368, 98.2631578947, 98.3684210526, 98.4736842105, 98.5789473684, 98.6842105263, 98.7894736842, 98.8947368421, 99.0]
      save_as: pdl_validation_anchor_positions
  - block: pdl_fit_basis_matrices
    params:
      coefficients: pdl_coefficients
      representation_indices: pdl_representation_indices
      train_posterior: pdl_train_posteriors
      validation_posterior: pdl_validation_posteriors
      train_anchors: pdl_train_anchor_positions
      validation_anchors: pdl_validation_anchor_positions
      basis_epochs: 1500
      basis_learning_rate: 0.001
      basis_loss_threshold: 0.02
      representation_seed: 1
  - block: pdl_estimate_instance_transition
    params:
      parts: pdl_parts
      coefficients: pdl_coefficients
      representation_indices: pdl_representation_indices
      train_features: pdl_train_features
      train_posterior: pdl_train_posteriors
      validation_features: pdl_validation_features
      validation_posterior: pdl_validation_posteriors
      train_basis: pdl_train_basis
      validation_basis: pdl_validation_basis
      num_parts: 20
      representation_seed: 1
  - block: create_optimizer
    params:
      optimizer: sgd
      model: model
      lr: 0.01
      momentum: 0.9
      nesterov: false
      weight_decay: 0.0001
      save_as: correction_optimizer
  - block: epoch_loop
    params: {epochs: 49}
    steps:
      - block: refresh_epoch_loader
        params: {data: prepared_data, role: train, batch_size: 128, save_as: train_loader}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - block: zero_grad
            params: {optimizer: correction_optimizer}
          - block: forward
            params: {model: model, input: images, save_as: logits}
          - block: softmax
            params: {logits: logits, detach: false, save_as: pdl_clean_probabilities}
          - block: materialize_transition
            params: {artifact: pdl_transition, indices: indices, device: device, save_as: pdl_transition_matrix}
          - block: apply_transition
            params: {probabilities: pdl_clean_probabilities, transition: pdl_transition_matrix, save_as: pdl_observed_probabilities}
          - block: gather_by_label
            params: {values: pdl_clean_probabilities, labels: labels, save_as: pdl_clean_target_probability}
          - block: gather_by_label
            params: {values: pdl_observed_probabilities, labels: labels, save_as: pdl_observed_target_probability}
          - block: clamp_min
            params: {input: pdl_clean_target_probability, minimum: 1.0e-12, save_as: pdl_clean_target_probability_safe}
          - block: clamp_min
            params: {input: pdl_observed_target_probability, minimum: 1.0e-12, save_as: pdl_observed_target_probability_safe}
          - block: safe_divide
            params: {numerator: pdl_clean_target_probability_safe, denominator: pdl_observed_target_probability_safe, minimum: 1.0e-12, save_as: pdl_correction_weight}
          - block: negative_log
            params: {input: pdl_clean_target_probability_safe, minimum: 1.0e-12, save_as: pdl_negative_log_probability}
          - block: elementwise_multiply
            params: {left: pdl_correction_weight, right: pdl_negative_log_probability, save_as: loss_per_sample}
          - block: mean_loss
            params: {input: loss_per_sample, save_as: loss}
          - {block: backward}
          - block: optimizer_step
            params: {optimizer: correction_optimizer}
      - block: evaluate_transition_accuracy
        params: {model: model, loader: validation_loader, transition: pdl_validation_transition, device: device, save_as: correction_validation_accuracy}
      - block: track_best_model
        params: {model: model, metric: correction_validation_accuracy, metric_name: correction_validation_accuracy, save_as: best_correction_state}
  - block: restore_best_model
    params: {model: model, state: best_correction_state}
  - block: zero_module_parameters
    params: {module: model, submodule: T_revision}
  - block: create_optimizer
    params:
      optimizer: adam
      model: model
      lr: 0.0000005
      weight_decay: 0.0001
      save_as: revision_optimizer
  - block: epoch_loop
    params: {epochs: 49}
    steps:
      - block: refresh_epoch_loader
        params: {data: prepared_data, role: train, batch_size: 128, save_as: train_loader}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - block: zero_grad
            params: {optimizer: revision_optimizer}
          - block: forward
            params: {model: model, input: images, save_as: logits}
          - block: compose_revision_transition
            params: {model: model, indices: indices, transition: pdl_transition, save_as: revised_transition}
          - block: softmax
            params: {logits: logits, detach: false, save_as: pdl_clean_probabilities}
          - block: materialize_transition
            params: {artifact: revised_transition, indices: indices, device: device, save_as: pdl_revised_transition_matrix}
          - block: apply_transition
            params: {probabilities: pdl_clean_probabilities, transition: pdl_revised_transition_matrix, save_as: pdl_observed_probabilities}
          - block: gather_by_label
            params: {values: pdl_clean_probabilities, labels: labels, save_as: pdl_clean_target_probability}
          - block: gather_by_label
            params: {values: pdl_observed_probabilities, labels: labels, save_as: pdl_observed_target_probability}
          - block: clamp_min
            params: {input: pdl_clean_target_probability, minimum: 1.0e-12, save_as: pdl_clean_target_probability_safe}
          - block: clamp_min
            params: {input: pdl_observed_target_probability, minimum: 1.0e-12, save_as: pdl_observed_target_probability_safe}
          - block: safe_divide
            params: {numerator: pdl_clean_target_probability_safe, denominator: pdl_observed_target_probability_safe, minimum: 1.0e-12, save_as: pdl_revision_correction_weight}
          - block: negative_log
            params: {input: pdl_clean_target_probability_safe, minimum: 1.0e-12, save_as: pdl_revision_negative_log_probability}
          - block: elementwise_multiply
            params: {left: pdl_revision_correction_weight, right: pdl_revision_negative_log_probability, save_as: loss_per_sample}
          - block: mean_loss
            params: {input: loss_per_sample, save_as: loss}
          - {block: backward}
          - block: optimizer_step
            params: {optimizer: revision_optimizer}
      - block: evaluate_transition_accuracy
        params: {model: model, loader: validation_loader, transition: pdl_revision_validation_transition, device: device, revision: true, save_as: revision_validation_accuracy}
      - block: track_best_model
        params: {model: model, metric: revision_validation_accuracy, metric_name: revision_validation_accuracy, save_as: best_revision_state}
  - block: restore_best_model
    params: {model: model, state: best_revision_state}
  - block: evaluate_accuracy
    params: {model: model, loader: test_loader, save_as: test_accuracy, final: true}
  - block: record_metrics
    params: {values: [test_accuracy, correction_validation_accuracy, revision_validation_accuracy, best_epoch]}
