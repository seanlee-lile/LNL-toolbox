schema_version: 1
name: lend
description: "Formal LEND CIFAR-10 symmetric-40 recipe with ResNet18 features, graph-style label dilution, SGD, and multi-step schedule."
steps:
  - {block: set_seed, params: {seed: 1}}
  - {block: select_device, params: {device: auto}}
  - {block: load_dataset, params: {dataset: cifar10}}
  - {block: inspect_dataset_semantics}
  - {block: create_dataset_split, params: {validation_size: 5000, split_seed: 1}}
  - {block: select_label_source, params: {validation: observed}}
  - {block: apply_noise, params: {name: symmetric, rate: 0.4, seed: 1}}
  - {block: build_noise_manifest}
  - {block: configure_preprocessing, params: {preprocessing: standard, augment: true}}
  - {block: configure_views, params: {views: [weak]}}
  - {block: assign_data_roles, params: {roles: [train, noisy_validation, test]}}
  - {block: configure_loader, params: {batch_size: 256, num_workers: 4, pin_memory: true}}
  - {block: build_prepared_data}
  - {block: build_loaders}
  - {block: create_model, params: {model: resnet18, num_classes: 10, base_width: 64, device: device, save_as: model}}
  - {block: create_optimizer, params: {optimizer: sgd, model: model, lr: 0.05, momentum: 0.9, weight_decay: 0.0005, save_as: optimizer}}
  - {block: create_scheduler, params: {scheduler: multistep, optimizer: optimizer, milestones: [100], gamma: 0.1, save_as: scheduler}}
  - {block: create_indexed_history, params: {prepared_data: prepared_data, width: 10, save_as: lend_state}}
  - block: epoch_loop
    params: {epochs: 200}
    steps:
      - {block: refresh_epoch_loader, params: {data: prepared_data, role: train, batch_size: 256, save_as: train_loader}}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - {block: zero_grad}
          - {block: forward_feature}
          - {block: per_sample_ce}
          - {block: pairwise_similarity, params: {features: features, metric: inner_product, normalize_features: false, save_as: lend_similarity}}
          - {block: topk_neighborhood, params: {similarity: lend_similarity, k: 8, gamma: 1.0, save_as: lend_adjacency}}
          - {block: normalize_graph, params: {adjacency: lend_adjacency, save_as: lend_graph}}
          - {block: propagate_labels, params: {graph: lend_graph, labels: labels, num_classes: 10, alpha: 0.99, steps: 10, save_as: diluted_labels}}
          - {block: indexed_ema, params: {state: lend_state, indices: indices, values: diluted_labels, beta: 0.9, save_as: history_values}}
          - {block: agreement_mask, params: {labels: labels, history: history_values, save_as: lend_selected}}
          - {block: masked_mean, params: {values: loss_per_sample, mask: lend_selected, denominator: batch, empty: zero, save_as: loss}}
          - {block: backward}
          - {block: optimizer_step}
      - {block: evaluate_accuracy, params: {model: model, loader: validation_loader, save_as: validation_accuracy}}
      - {block: track_best_model, params: {model: model, metric: validation_accuracy, metric_name: validation_accuracy}}
      - {block: scheduler_step}
  - {block: restore_best_model, params: {model: model, state: best_model_state}}
  - {block: evaluate_accuracy, params: {model: model, loader: test_loader, save_as: test_accuracy, final: true}}
