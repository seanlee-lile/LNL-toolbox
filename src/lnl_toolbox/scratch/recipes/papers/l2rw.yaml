schema_version: 1
name: l2rw
description: "Formal L2RW CIFAR-10 uniform-40 recipe with L2RW ResNet32, trusted-meta weighting, SGD, and official long horizon."
steps:
  - {block: set_seed, params: {seed: 1234}}
  - {block: select_device, params: {device: auto}}
  - {block: load_dataset, params: {dataset: cifar10, options: {num_clean: 100, trusted_seed: 1234}}}
  - {block: inspect_dataset_semantics}
  - {block: create_dataset_split, params: {validation_size: 5000, split_seed: 0}}
  - {block: select_label_source, params: {validation: observed}}
  - {block: apply_noise, params: {name: symmetric, rate: 0.4, seed: 0}}
  - {block: build_noise_manifest}
  - {block: configure_preprocessing, params: {preprocessing: standard, augment: true}}
  - {block: configure_views, params: {views: [weak]}}
  - {block: assign_data_roles, params: {roles: [train, noisy_validation, trusted_validation, test]}}
  - {block: configure_loader, params: {batch_size: 100, num_workers: 4, pin_memory: true}}
  - {block: build_prepared_data}
  - {block: build_loaders}
  - {block: create_model, params: {model: l2rw_resnet32, num_classes: 10, base_width: 16, device: device, save_as: model}}
  - {block: create_optimizer, params: {optimizer: sgd, model: model, lr: 0.1, momentum: 0.9, weight_decay: 0.0002, save_as: optimizer}}
  - block: epoch_loop
    params: {epochs: 180}
    steps:
      - {block: refresh_epoch_loader, params: {data: prepared_data, role: train, batch_size: 100, save_as: train_loader}}
      - block: batch_loop
        params: {loader: train_loader, max_steps: 80000, global_step_as: l2rw_global_step}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - {block: step_milestone_update, params: {optimizer: optimizer, milestones: [40000, 60000], gamma: 0.1, steps_per_epoch: 450, global_step: l2rw_global_step}}
          - {block: zero_grad}
          - {block: forward}
          - {block: per_sample_ce}
          - {block: get_next_batch, params: {loader: trusted_loader, input_as: trusted_images, label_as: trusted_labels}}
          - {block: zeros_like, params: {input: loss_per_sample, requires_grad: true, save_as: l2rw_epsilon}}
          - {block: elementwise_multiply, params: {left: l2rw_epsilon, right: loss_per_sample, save_as: l2rw_weighted_losses}}
          - {block: sum_values, params: {input: l2rw_weighted_losses, save_as: l2rw_virtual_loss}}
          - {block: virtual_parameter_update, params: {model: model, loss: l2rw_virtual_loss, learning_rate: 1.0, create_graph: true, save_as: l2rw_virtual_state}}
          - {block: functional_forward_with_state, params: {model: model, state: l2rw_virtual_state, inputs: trusted_images, save_as: l2rw_trusted_logits}}
          - {block: per_sample_ce, params: {logits: l2rw_trusted_logits, labels: trusted_labels, save_as: l2rw_trusted_loss_per_sample}}
          - {block: mean_loss, params: {input: l2rw_trusted_loss_per_sample, save_as: l2rw_trusted_loss}}
          - {block: parameter_squared_norm, params: {model: model, save_as: l2rw_parameter_norm}}
          - {block: weighted_sum, params: {terms: [l2rw_trusted_loss, l2rw_parameter_norm], weights: [1.0, 0.0001], save_as: l2rw_meta_loss}}
          - {block: gradient_wrt, params: {loss: l2rw_meta_loss, input: l2rw_epsilon, create_graph: false, save_as: l2rw_meta_gradient}}
          - {block: nonnegative_projection, params: {input: l2rw_meta_gradient, negate: false, save_as: l2rw_raw_weights}}
          - {block: normalize_nonnegative_weights, params: {weights: l2rw_raw_weights, save_as: meta_weights}}
          - {block: elementwise_multiply, params: {left: loss_per_sample, right: meta_weights, save_as: weighted_loss_per_sample}}
          - {block: mean_loss, params: {input: weighted_loss_per_sample, save_as: loss}}
          - {block: backward}
          - {block: optimizer_step}
      - {block: evaluate_accuracy, params: {model: model, loader: validation_loader, save_as: validation_accuracy}}
  - {block: evaluate_accuracy, params: {model: model, loader: test_loader, save_as: test_accuracy, final: true}}
