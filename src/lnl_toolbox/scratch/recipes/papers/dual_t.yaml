schema_version: 1
name: dual-t
description: "Complete Dual-T reproduction: CIFAR-10 standard preprocessing, symmetric noise 0.2, posterior ResNet-18 stage, stable posterior snapshot, Dual-T T-club/T-spade estimation, fresh ResNet-18 Forward-correction stage, and 100 epochs per stage."
steps:
  - block: set_seed
    params: {seed: 1}
  - block: select_device
    params: {device: auto}
  - block: prepare_dual_t_cifar10
    params:
      root: ''
      validation_size: 10000
      augment: true
      noise_rate: 0.2
      noise_seed: 1
      batch_size: 128
  - block: create_model
    params: {model: cifar_resnet18, num_classes: 10, base_width: 64, device: device, save_as: posterior_model}
  - block: create_optimizer
    params:
      optimizer: sgd
      model: posterior_model
      lr: 0.01
      momentum: 0.9
      nesterov: false
      weight_decay: 0.0005
      save_as: posterior_optimizer
  - block: create_scheduler
    params:
      scheduler: multistep
      optimizer: posterior_optimizer
      milestones: [50]
      gamma: 0.1
      save_as: posterior_scheduler
  - block: epoch_loop
    params: {epochs: 100}
    steps:
      - block: refresh_epoch_loader
        params: {data: prepared_data, role: train, batch_size: 128, save_as: train_loader}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - block: zero_grad
            params: {optimizer: posterior_optimizer}
          - block: forward
            params: {model: posterior_model, input: images, save_as: logits}
          - block: per_sample_ce
            params: {logits: logits, labels: labels, save_as: loss_per_sample}
          - block: mean_loss
            params: {input: loss_per_sample, save_as: loss}
          - {block: backward}
          - block: optimizer_step
            params: {optimizer: posterior_optimizer}
      - block: evaluate_accuracy
        params: {model: posterior_model, loader: validation_loader, save_as: posterior_validation_accuracy}
      - block: track_best_model
        params: {model: posterior_model, metric: posterior_validation_accuracy, metric_name: posterior_validation_accuracy, save_as: best_posterior_state}
      - block: scheduler_step
        params: {scheduler: posterior_scheduler}
  - block: restore_best_model
    params: {model: posterior_model, state: best_posterior_state}
  - block: snapshot_posterior_model
    params: {model: posterior_model, loader: train_loader, prepared_data: prepared_data, device: device}
  - block: dual_t_transition_estimation
    params: {posterior: posterior_snapshot, save_as: transition}
  - block: create_model
    params: {model: cifar_resnet18, num_classes: 10, base_width: 64, device: device, save_as: final_model}
  - block: create_optimizer
    params:
      optimizer: sgd
      model: final_model
      lr: 0.01
      momentum: 0.9
      nesterov: false
      weight_decay: 0.0005
      save_as: final_optimizer
  - block: create_scheduler
    params:
      scheduler: multistep
      optimizer: final_optimizer
      milestones: [50]
      gamma: 0.1
      save_as: final_scheduler
  - block: epoch_loop
    params: {epochs: 100}
    steps:
      - block: refresh_epoch_loader
        params: {data: prepared_data, role: train, batch_size: 128, save_as: train_loader}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - block: zero_grad
            params: {optimizer: final_optimizer}
          - block: forward
            params: {model: final_model, input: images, save_as: logits}
          - block: forward_correction
            params: {logits: logits, labels: labels, transition: transition, save_as: loss_per_sample}
          - block: mean_loss
            params: {input: loss_per_sample, save_as: loss}
          - {block: backward}
          - block: optimizer_step
            params: {optimizer: final_optimizer}
      - block: evaluate_accuracy
        params: {model: final_model, loader: validation_loader, save_as: final_validation_accuracy}
      - block: track_best_model
        params: {model: final_model, metric: final_validation_accuracy, metric_name: final_validation_accuracy, save_as: best_final_state}
      - block: scheduler_step
        params: {scheduler: final_scheduler}
  - block: restore_best_model
    params: {model: final_model, state: best_final_state}
  - block: evaluate_accuracy
    params: {model: final_model, loader: test_loader, save_as: test_accuracy, final: true}
  - block: record_metrics
    params: {values: [test_accuracy, best_final_validation_accuracy, best_epoch]}
