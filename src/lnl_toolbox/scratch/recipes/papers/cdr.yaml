schema_version: 1
name: cdr
description: "Complete CDR reproduction: CIFAR-10 GCE-2018 preprocessing, symmetric transition noise 0.4, ResNet-50 base_width64, paper-mode critical parameter updates with L1, SGD, MultiStepLR, and 100 epochs."
steps:
  - block: set_seed
    params: {seed: 1}
  - block: select_device
    params: {device: auto}
  - {block: load_dataset, params: {dataset: cifar10}}
  - {block: inspect_dataset_semantics}
  - {block: create_dataset_split, params: {validation_size: 5000, split_seed: 1}}
  - {block: select_label_source, params: {validation: observed}}
  - {block: apply_noise, params: {name: symmetric, rate: 0.4, seed: 1, sampling: transition, options: {rng: numpy_legacy}}}
  - {block: build_noise_manifest}
  - {block: configure_preprocessing, params: {preprocessing: gce2018, augment: true}}
  - {block: configure_views, params: {views: [weak]}}
  - {block: assign_data_roles, params: {roles: [train, noisy_validation, test]}}
  - {block: configure_loader, params: {batch_size: 64, num_workers: 0, pin_memory: true}}
  - {block: build_prepared_data}
  - {block: build_loaders}
  - block: create_model
    params: {model: resnet50, num_classes: 10, base_width: 64, device: device}
  - block: create_optimizer
    params:
      optimizer: sgd
      model: model
      lr: 0.01
      momentum: 0.9
      nesterov: false
      weight_decay: 0.001
  - block: create_scheduler
    params:
      scheduler: multistep
      optimizer: optimizer
      milestones: [40, 80]
      gamma: 0.1
  - block: epoch_loop
    params: {epochs: 100}
    steps:
      - block: refresh_epoch_loader
        params: {data: prepared_data, role: train, batch_size: 64, save_as: train_loader}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - {block: zero_grad}
          - {block: forward}
          - block: per_sample_ce
            params: {logits: logits, labels: labels, save_as: loss_per_sample}
          - block: mean_loss
            params: {input: loss_per_sample, save_as: loss}
          - {block: backward}
          - block: parameter_criticality_mask
            params: {model: model, noise_rate: 0.4, save_as: cdr_masks}
          - block: masked_gradient_update
            params: {model: model, masks: cdr_masks, scale: 0.6, l1_decay: 0.001}
          - {block: optimizer_step}
      - block: evaluate_accuracy
        params: {model: model, loader: validation_loader, save_as: validation_accuracy}
      - block: track_best_model
        params: {model: model, metric: validation_accuracy, metric_name: validation_accuracy}
      - block: scheduler_step
        params: {scheduler: scheduler}
  - block: restore_best_model
    params: {model: model, state: best_model_state}
  - block: evaluate_accuracy
    params: {model: model, loader: test_loader, save_as: test_accuracy, final: true}
  - block: record_metrics
    params: {values: [test_accuracy, best_validation_accuracy, best_epoch]}
