schema_version: 1
name: cdr
description: "Complete CDR reproduction: CIFAR-10 GCE-2018 preprocessing, symmetric transition noise 0.4, ResNet-50 base_width64, paper-mode critical parameter updates with L1, SGD, MultiStepLR, and 100 epochs."
steps:
  - block: set_seed
    params: {seed: 1}
  - block: select_device
    params: {device: auto}
  - block: prepare_cdr_cifar10
    params:
      root: ''
      validation_size: 5000
      augment: true
      noise_rate: 0.4
      noise_seed: 1
      batch_size: 64
  - block: create_model
    params: {model: resnet50, num_classes: 10, base_width: 64, device: device}
  - block: create_optimizer
    params:
      optimizer: sgd
      model: model
      lr: 0.01
      momentum: 0.0
      nesterov: false
      weight_decay: 0.0
  - block: create_scheduler
    params:
      scheduler: multistep
      optimizer: optimizer
      milestones: [40, 80]
      gamma: 0.1
  - block: epoch_loop
    params: {epochs: 100}
    steps:
      - block: refresh_epoch_loader
        params: {data: prepared_data, role: train, batch_size: 64, save_as: train_loader}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - {block: zero_grad}
          - {block: forward}
          - block: per_sample_ce
            params: {logits: logits, labels: labels, save_as: loss_per_sample}
          - block: mean_loss
            params: {input: loss_per_sample, save_as: loss}
          - {block: backward}
          - block: cdr_criticality_score
            params: {model: model, noise_rate: 0.4, save_as: cdr_masks}
          - block: cdr_masked_gradient_update
            params: {model: model, masks: cdr_masks, noise_rate: 0.4, l1_decay: 0.001}
          - {block: optimizer_step}
      - block: evaluate_accuracy
        params: {model: model, loader: validation_loader, save_as: validation_accuracy}
      - block: track_best_model
        params: {model: model, metric: validation_accuracy, metric_name: validation_accuracy}
      - block: scheduler_step
        params: {scheduler: scheduler}
  - block: restore_best_model
    params: {model: model, state: best_model_state}
  - block: evaluate_accuracy
    params: {model: model, loader: test_loader, save_as: test_accuracy, final: true}
  - block: record_metrics
    params: {values: [test_accuracy, best_validation_accuracy, best_epoch]}
