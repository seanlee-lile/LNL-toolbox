schema_version: 1
name: volminnet
description: "Complete VolMinNet reproduction: CIFAR-10 symmetric-20, joint classifier/transition training, positive logdet minimum-volume objective, noisy-validation minimum-loss selection, and clean-test evaluation."
steps:
  - block: set_seed
    params: {seed: 1}
  - block: select_device
    params: {device: auto}
  - {block: load_dataset, params: {dataset: cifar10}}
  - {block: inspect_dataset_semantics}
  - {block: create_dataset_split, params: {validation_size: 5000, split_strategy: stratified, split_seed: 1}}
  - {block: select_label_source, params: {validation: observed}}
  - {block: apply_noise, params: {name: symmetric, rate: 0.2, seed: 1, sampling: transition}}
  - {block: build_noise_manifest}
  - {block: configure_preprocessing, params: {preprocessing: standard, augment: true}}
  - {block: configure_views, params: {views: [weak]}}
  - {block: assign_data_roles, params: {roles: [train, noisy_validation, test]}}
  - {block: configure_loader, params: {batch_size: 128, num_workers: 4, pin_memory: true}}
  - {block: build_prepared_data}
  - {block: build_loaders}
  - block: create_model
    params:
      model: resnet18
      num_classes: 10
      base_width: 64
      device: device
      save_as: model
  - block: create_sigmoid_offdiagonal_transition
    params: {num_classes: 10, device: device, save_as: transition}
  - block: create_optimizer
    params:
      optimizer: sgd
      model: model
      lr: 0.01
      momentum: 0.9
      weight_decay: 0.001
      save_as: classifier_optimizer
  - block: create_optimizer
    params:
      optimizer: sgd
      model: transition
      lr: 0.01
      momentum: 0.9
      weight_decay: 0.001
      save_as: transition_optimizer
  - block: create_scheduler
    params:
      scheduler: multistep
      optimizer: classifier_optimizer
      milestones: [30, 60]
      gamma: 0.1
      save_as: classifier_scheduler
  - block: create_scheduler
    params:
      scheduler: multistep
      optimizer: transition_optimizer
      milestones: [30, 60]
      gamma: 0.1
      save_as: transition_scheduler
  - block: epoch_loop
    params: {epochs: 150}
    steps:
      - block: refresh_epoch_loader
        params: {data: prepared_data, role: train, batch_size: 128, save_as: train_loader}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - block: zero_grad
            params: {optimizer: classifier_optimizer}
          - block: zero_grad
            params: {optimizer: transition_optimizer}
          - block: forward
            params: {model: model, input: images, save_as: logits}
          - block: materialize_transition
            params: {artifact: transition, save_as: transition_matrix}
          - block: softmax
            params: {logits: logits, save_as: probabilities}
          - block: apply_transition
            params: {probabilities: probabilities, transition: transition_matrix, save_as: noisy_probabilities}
          - block: gather_by_label
            params: {values: noisy_probabilities, labels: labels, save_as: noisy_target_probability}
          - block: negative_log
            params: {input: noisy_target_probability, save_as: loss_per_sample}
          - block: mean_loss
            params: {input: loss_per_sample, save_as: classification_loss}
          - block: positive_logdet
            params: {matrix: transition_matrix, save_as: volume_logdet}
          - block: weighted_sum
            params: {terms: [classification_loss, volume_logdet], weights: [1.0, 0.0001], save_as: loss}
          - {block: backward}
          - block: optimizer_step
            params: {optimizer: classifier_optimizer}
          - block: optimizer_step
            params: {optimizer: transition_optimizer}
      - block: evaluate_transition_accuracy
        params:
          model: model
          transition: transition
          loader: validation_loader
          device: device
          metric: loss
          save_as: validation_loss
      - block: track_best_state
        params: {model: model, auxiliary: transition, metric: validation_loss, metric_name: validation_loss, mode: min, save_as: best_volmin_state}
      - block: scheduler_step
        params: {scheduler: classifier_scheduler}
      - block: scheduler_step
        params: {scheduler: transition_scheduler}
  - block: restore_best_state
    params: {model: model, auxiliary: transition, state: best_volmin_state}
  - block: evaluate_accuracy
    params: {model: model, loader: test_loader, save_as: test_accuracy, final: true}
  - block: record_metrics
    params: {values: [test_accuracy, validation_loss, validation_accuracy, best_epoch]}
