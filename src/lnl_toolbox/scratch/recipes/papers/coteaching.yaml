schema_version: 1
name: coteaching
description: Co-teaching formula-level dual-peer smoke recipe.
steps:
  - block: set_seed
    params: {seed: 1}
  - block: select_device
    params: {device: cpu}
  - block: select_dataset
    params:
      source_mode: builtin
      dataset: synthetic
      save_as: train_dataset
  - block: configure_noise
    params: {method: none, rate: 0.0, seed: 1}
  - block: create_loader
    params: {dataset: train_dataset, batch_size: 16, shuffle: true, save_as: train_loader}
  - block: create_model
    params: {model: mlp, num_classes: 2, input_dim: 4, device: device, save_as: model_a}
  - block: create_model
    params: {model: mlp, num_classes: 2, input_dim: 4, device: device, save_as: model_b}
  - block: create_optimizer
    params: {optimizer: sgd, model: model_a, lr: 0.1, save_as: optimizer_a}
  - block: create_optimizer
    params: {optimizer: sgd, model: model_b, lr: 0.1, save_as: optimizer_b}
  - block: epoch_loop
    params: {epochs: 1}
    steps:
      - block: remember_rate_formula
        params: {noise_rate: 0.2, warmup_epochs: 10, save_as: remember_rate}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - block: get_batch
          - block: zero_grad
            params: {optimizer: optimizer_a}
          - block: zero_grad
            params: {optimizer: optimizer_b}
          - block: forward
            params: {model: model_a, save_as: logits_a}
          - block: forward
            params: {model: model_b, save_as: logits_b}
          - block: per_sample_ce
            params: {logits: logits_a, save_as: loss_a_per_sample}
          - block: per_sample_ce
            params: {logits: logits_b, save_as: loss_b_per_sample}
          - block: small_loss_indices
            params: {input: loss_a_per_sample, remember_rate: remember_rate, save_as: selected_a}
          - block: small_loss_indices
            params: {input: loss_b_per_sample, remember_rate: remember_rate, save_as: selected_b}
          - block: cross_select_loss_a_from_b
            params: {loss: loss_a_per_sample, indices: selected_b, save_as: loss_a}
          - block: cross_select_loss_b_from_a
            params: {loss: loss_b_per_sample, indices: selected_a, save_as: loss_b}
          - block: backward
            params: {loss: loss_a}
          - block: optimizer_step
            params: {optimizer: optimizer_a}
          - block: backward
            params: {loss: loss_b}
          - block: optimizer_step
            params: {optimizer: optimizer_b}
