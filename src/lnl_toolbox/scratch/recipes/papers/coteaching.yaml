schema_version: 1
name: coteaching
description: "Complete Co-teaching CIFAR-10 reproduction recipe: formal transition noise, dual CifarCnn8 peers, remember-rate schedule, peer cross-update, ensemble validation selection, and 200 epochs."
steps:
  - block: set_seed
    params: {seed: 1}
  - block: select_device
    params: {device: auto}
  - {block: load_dataset, params: {dataset: cifar10}}
  - {block: inspect_dataset_semantics}
  - {block: create_dataset_split, params: {validation_size: 5000, split_seed: 1}}
  - {block: select_label_source, params: {validation: observed}}
  - {block: apply_noise, params: {name: symmetric, rate: 0.2, seed: 1, sampling: transition}}
  - {block: build_noise_manifest}
  - {block: configure_preprocessing, params: {preprocessing: standard, augment: true}}
  - {block: configure_views, params: {views: [weak]}}
  - {block: assign_data_roles, params: {roles: [train, noisy_validation, test]}}
  - {block: configure_loader, params: {batch_size: 128, num_workers: 4, pin_memory: true}}
  - {block: build_prepared_data}
  - {block: build_loaders}
  - block: create_model
    params: {model: cifar_cnn8, num_classes: 10, device: device, save_as: model_a}
  - block: create_model
    params: {model: cifar_cnn8, num_classes: 10, device: device, save_as: model_b}
  - block: create_optimizer
    params: {optimizer: adam, model: model_a, lr: 0.001, weight_decay: 0.0, save_as: optimizer_a}
  - block: create_optimizer
    params: {optimizer: adam, model: model_b, lr: 0.001, weight_decay: 0.0, save_as: optimizer_b}
  - block: epoch_loop
    params: {epochs: 200}
    steps:
      - block: refresh_epoch_loader
        params: {data: prepared_data, role: train, batch_size: 128, save_as: train_loader}
      - block: linear_rate_schedule
        params: {start: 1.0, end: 0.8, warmup_epochs: 10, save_as: remember_rate}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - block: zero_grad
            params: {optimizer: optimizer_a}
          - block: zero_grad
            params: {optimizer: optimizer_b}
          - block: forward
            params: {model: model_a, save_as: logits_a}
          - block: forward
            params: {model: model_b, save_as: logits_b}
          - block: per_sample_ce
            params: {logits: logits_a, save_as: loss_a_per_sample}
          - block: per_sample_ce
            params: {logits: logits_b, save_as: loss_b_per_sample}
          - block: select_lowest_scores
            params: {scores: loss_a_per_sample, keep_fraction: remember_rate, stable_sample_indices: indices, rounding: floor, minimum_count: 1, save_as: selected_a}
          - block: select_lowest_scores
            params: {scores: loss_b_per_sample, keep_fraction: remember_rate, stable_sample_indices: indices, rounding: floor, minimum_count: 1, save_as: selected_b}
          - block: select_by_indices
            params: {values: loss_a_per_sample, indices: selected_b, save_as: selected_loss_a}
          - block: mean_loss
            params: {input: selected_loss_a, save_as: loss_a}
          - block: select_by_indices
            params: {values: loss_b_per_sample, indices: selected_a, save_as: selected_loss_b}
          - block: mean_loss
            params: {input: selected_loss_b, save_as: loss_b}
          - block: backward
            params: {loss: loss_a}
          - block: optimizer_step
            params: {optimizer: optimizer_a}
          - block: backward
            params: {loss: loss_b}
          - block: optimizer_step
            params: {optimizer: optimizer_b}
      - block: evaluate_peer_ensemble
        params: {model_a: model_a, model_b: model_b, loader: validation_loader, save_as: ensemble_accuracy}
      - block: track_best_peer_models
        params: {model_a: model_a, model_b: model_b, metric: ensemble_accuracy, save_as: best_peer_model_state}
  - block: restore_best_peer_models
    params: {model_a: model_a, model_b: model_b, state: best_peer_model_state}
  - block: evaluate_peer_ensemble
    params: {model_a: model_a, model_b: model_b, loader: test_loader, save_as: test_ensemble_accuracy, final: true}
  - block: record_metrics
    params: {values: [test_ensemble_accuracy, best_ensemble_accuracy, best_epoch]}
