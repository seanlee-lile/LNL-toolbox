schema_version: 1
name: jocor
description: "Complete JoCoR CIFAR-10 reproduction recipe: tensor-only preprocessing, symmetric transition noise 0.5, two CifarSixConvNet peers, Adam, linear LR/beta schedule, joint symmetric-KL loss, floor small-loss selection, test selection, and 200 epochs."
steps:
  - block: set_seed
    params: {seed: 1}
  - block: select_device
    params: {device: auto}
  - block: prepare_jocor_cifar10
    params:
      root: ''
      noise_rate: 0.5
      noise_seed: 0
      batch_size: 128
      num_workers: 4
  - block: create_model
    params: {model: cifar_six_conv, num_classes: 10, device: device, save_as: model_a}
  - block: create_model
    params: {model: cifar_six_conv, num_classes: 10, device: device, save_as: model_b}
  - block: create_joint_optimizer
    params:
      optimizer: adam
      model_a: model_a
      model_b: model_b
      lr: 0.001
      beta1: 0.9
      beta2: 0.999
      weight_decay: 0.0
  - block: create_scheduler
    params:
      scheduler: linear_decay
      optimizer: optimizer
      start_epoch: 80
      end_epoch: 200
      initial_lr: 0.001
      final_lr: 0.0
      beta1_before: 0.9
      beta1_after: 0.1
  - block: epoch_loop
    params: {epochs: 200}
    steps:
      - block: jocor_keep_rate_formula
        params: {start: 1.0, end: 0.5, warmup_epochs: 9}
      - block: refresh_epoch_loader
        params: {data: prepared_data, role: train, batch_size: 128, save_as: train_loader}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - {block: zero_grad}
          - {block: forward_two_models}
          - block: per_sample_ce
            params: {logits: logits_a, labels: labels, save_as: loss_a_per_sample}
          - block: per_sample_ce
            params: {logits: logits_b, labels: labels, save_as: loss_b_per_sample}
          - {block: jocor_symmetric_kl}
          - block: jocor_joint_composition
            params: {lambda_: 0.9, save_as: joint_loss_per_sample}
          - {block: jocor_small_loss_indices}
          - {block: mean_selected_loss}
          - {block: backward}
          - {block: optimizer_step}
      - block: evaluate_peer_ensemble
        params: {model_a: model_a, model_b: model_b, loader: test_loader, save_as: ensemble_accuracy}
      - block: track_best_peer_models
        params: {model_a: model_a, model_b: model_b, metric: ensemble_accuracy}
      - block: scheduler_step
        params: {scheduler: scheduler}
  - block: restore_best_peer_models
    params: {model_a: model_a, model_b: model_b, state: best_peer_model_state}
  - block: evaluate_peer_ensemble
    params: {model_a: model_a, model_b: model_b, loader: test_loader, save_as: test_accuracy, final: true}
  - block: record_metrics
    params: {values: [test_accuracy, best_ensemble_accuracy, best_epoch]}
