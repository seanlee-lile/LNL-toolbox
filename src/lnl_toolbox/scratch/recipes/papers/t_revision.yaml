schema_version: 1
name: t-revision
description: "Complete T-Revision Reweight-R reproduction: CIFAR-10 symmetric-20, stage-1 noisy classifier, pseudo-anchor transition initialization, classifier initialization, additive transition revision, noisy-validation selection, and clean-test evaluation."
steps:
  - block: set_seed
    params: {seed: 1}
  - block: select_device
    params: {device: auto}
  - {block: load_dataset, params: {dataset: cifar10}}
  - {block: inspect_dataset_semantics}
  - {block: create_dataset_split, params: {validation_size: 5000, split_seed: 1}}
  - {block: select_label_source, params: {validation: observed}}
  - {block: apply_noise, params: {name: symmetric, rate: 0.2, seed: 1, sampling: transition}}
  - {block: build_noise_manifest}
  - {block: configure_preprocessing, params: {preprocessing: standard, augment: true}}
  - {block: configure_views, params: {views: [weak]}}
  - {block: assign_data_roles, params: {roles: [train, train_eval, noisy_validation, test]}}
  - {block: configure_loader, params: {batch_size: 128, num_workers: 4, pin_memory: true}}
  - {block: build_prepared_data}
  - {block: build_loaders}
  - block: create_model
    params: {model: resnet18, num_classes: 10, base_width: 64, device: device, save_as: model}
  - block: create_optimizer
    params: {optimizer: sgd, model: model, lr: 0.01, momentum: 0.0, nesterov: false, weight_decay: 0.0001, save_as: stage1_optimizer}
  - block: epoch_loop
    params: {epochs: 15}
    steps:
      - block: refresh_epoch_loader
        params: {data: prepared_data, role: train, batch_size: 128, save_as: train_loader}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - block: zero_grad
            params: {optimizer: stage1_optimizer}
          - block: forward
            params: {model: model, input: images, save_as: logits}
          - block: per_sample_ce
            params: {logits: logits, labels: labels, save_as: loss_per_sample}
          - block: mean_loss
            params: {input: loss_per_sample, save_as: loss}
          - {block: backward}
          - block: optimizer_step
            params: {optimizer: stage1_optimizer}
      - block: evaluate_accuracy
        params: {model: model, loader: validation_loader, save_as: stage1_validation_accuracy}
      - block: track_best_model
        params: {model: model, metric: stage1_validation_accuracy, metric_name: stage1_validation_accuracy, save_as: best_stage1_state}
  - block: restore_best_model
    params: {model: model, state: best_stage1_state}
  - block: collect_posterior_snapshot
    params: {model: model, loader: train_eval_loader, device: device, dataset: cifar10, split: train, save_as: t_revision_posterior}
  - block: initialize_t_revision_transition
    params: {posterior: t_revision_posterior, device: device, save_as: transition}
  - block: create_optimizer
    params: {optimizer: sgd, model: model, lr: 0.01, momentum: 0.9, nesterov: false, weight_decay: 0.0001, save_as: classifier_optimizer}
  - block: create_scheduler
    params: {scheduler: multistep, optimizer: classifier_optimizer, milestones: [40, 80], gamma: 0.1, save_as: classifier_scheduler}
  - block: epoch_loop
    params: {epochs: 15}
    steps:
      - block: refresh_epoch_loader
        params: {data: prepared_data, role: train, batch_size: 128, save_as: train_loader}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - block: zero_grad
            params: {optimizer: classifier_optimizer}
          - block: forward
            params: {model: model, input: images, save_as: logits}
          - block: softmax
            params: {logits: logits, save_as: probabilities}
          - block: apply_transition
            params: {probabilities: probabilities, transition: transition, save_as: noisy_probabilities}
          - block: t_revision_importance_ratio
            params: {probabilities: probabilities, noisy_probabilities: noisy_probabilities, labels: labels, denominator_floor: 1.0e-12, save_as: sample_weights}
          - block: per_sample_ce
            params: {logits: logits, labels: labels, save_as: loss_per_sample}
          - block: detach
            params: {input: sample_weights, save_as: detached_sample_weights}
          - block: elementwise_multiply
            params: {left: loss_per_sample, right: detached_sample_weights, save_as: weighted_loss_per_sample}
          - block: mean_loss
            params: {input: weighted_loss_per_sample, save_as: loss}
          - {block: backward}
          - block: optimizer_step
            params: {optimizer: classifier_optimizer}
      - block: evaluate_transition_accuracy
        params: {model: model, transition: transition, loader: validation_loader, device: device, metric: loss, save_as: classifier_validation_loss}
      - block: track_best_model
        params: {model: model, metric: validation_accuracy, metric_name: revised_noisy_validation_accuracy, save_as: best_classifier_state}
      - block: scheduler_step
        params: {scheduler: classifier_scheduler}
  - block: restore_best_model
    params: {model: model, state: best_classifier_state}
  - block: create_additive_transition_revision
    params: {transition: transition, save_as: revision}
  - block: create_parameter_group_optimizer
    params:
      optimizer_spec: {name: adam, weight_decay: 0.0001}
      groups: [{source: model, lr: 0.0000005}, {source: revision, lr: 0.0000005}]
      save_as: revision_optimizer
  - block: epoch_loop
    params: {epochs: 20}
    steps:
      - block: refresh_epoch_loader
        params: {data: prepared_data, role: train, batch_size: 128, save_as: train_loader}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - block: zero_grad
            params: {optimizer: revision_optimizer}
          - block: forward
            params: {model: model, input: images, save_as: logits}
          - block: softmax
            params: {logits: logits, save_as: probabilities}
          - block: materialize_transition
            params: {artifact: revision, save_as: current_transition}
          - block: apply_transition
            params: {probabilities: probabilities, transition: current_transition, save_as: noisy_probabilities}
          - block: t_revision_importance_ratio
            params: {probabilities: probabilities, noisy_probabilities: noisy_probabilities, labels: labels, denominator_floor: 1.0e-12, save_as: sample_weights}
          - block: per_sample_ce
            params: {logits: logits, labels: labels, save_as: loss_per_sample}
          - block: elementwise_multiply
            params: {left: loss_per_sample, right: sample_weights, save_as: weighted_loss_per_sample}
          - block: mean_loss
            params: {input: weighted_loss_per_sample, save_as: loss}
          - {block: backward}
          - block: optimizer_step
            params: {optimizer: revision_optimizer}
      - block: evaluate_transition_accuracy
        params: {model: model, transition: revision, loader: validation_loader, device: device, metric: loss, save_as: revision_validation_loss}
      - block: track_best_state
        params: {model: model, auxiliary: revision, metric: validation_accuracy, metric_name: validation_accuracy, mode: max, save_as: best_t_revision_state}
  - block: restore_best_state
    params: {model: model, auxiliary: revision, state: best_t_revision_state}
  - block: evaluate_accuracy
    params: {model: model, loader: test_loader, save_as: test_accuracy, final: true}
  - block: record_metrics
    params: {values: [test_accuracy, stage1_validation_accuracy, classifier_validation_loss, revision_validation_loss, best_epoch]}
