schema_version: 1
name: cal
description: "Formal CAL CIFAR-10 IDN-20 recipe with immutable external labels, a separate CORES2 warm-up/proxy stage, and second-order risk."
steps:
  - {block: set_seed, params: {seed: 10086}}
  - {block: select_device, params: {device: auto}}
  - {block: prepare_cal_cifar10, params: {artifact_path: data/cal/IDN_0.2_C10.pt, batch_size: 128, num_workers: 0}}
  - {block: create_cal_state, params: {prepared_data: prepared_data, num_classes: 10, save_as: cal_state}}
  - {block: create_model, params: {model: resnet34, num_classes: 10, base_width: 64, initialization: torch_default, device: device, save_as: warmup_model}}
  - {block: create_optimizer, params: {optimizer: sgd, model: warmup_model, lr: 0.1, momentum: 0.9, weight_decay: 0.0005, save_as: warmup_optimizer}}
  - {block: create_alpha_scaled_scheduler, params: {optimizer: warmup_optimizer, milestones: [60], gamma: 0.1, save_as: warmup_scheduler}}
  - block: epoch_loop
    params: {epochs: 65}
    steps:
      - {block: refresh_epoch_loader, params: {data: prepared_data, role: train, batch_size: 128, save_as: train_loader}}
      - {block: cal_confidence_schedule, params: {default: 2.0, milestones: [10, 40, 80], values: [0.0, 2.0, 2.0], save_as: confidence_weight}}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - {block: zero_grad, params: {optimizer: warmup_optimizer}}
          - {block: forward, params: {model: warmup_model}}
          - {block: cal_warmup_objective, params: {logits: logits, labels: labels, noisy_prior: cal_noisy_prior, confidence_weight: confidence_weight, save_as: loss}}
          - {block: backward}
          - {block: optimizer_step, params: {optimizer: warmup_optimizer}}
      - {block: cal_confidence_schedule, params: {default: 2.0, milestones: [10, 40, 80], values: [0.0, 2.0, 2.0], epoch_offset: 1, save_as: next_confidence_weight}}
      - {block: alpha_scaled_scheduler_step, params: {scheduler: warmup_scheduler, confidence_weight: next_confidence_weight}}
  - {block: cal_materialize_proxy_artifact, params: {model: warmup_model, loader: train_eval_loader, prepared_data: prepared_data, state: cal_state, confidence_weight: confidence_weight, lower_threshold: -8.0, upper_threshold: -8.0}}
  - {block: create_model, params: {model: resnet34, num_classes: 10, base_width: 64, initialization: torch_default, device: device, save_as: model}}
  - {block: create_optimizer, params: {optimizer: sgd, model: model, lr: 0.1, momentum: 0.9, weight_decay: 0.0005, save_as: optimizer}}
  - {block: create_alpha_scaled_scheduler, params: {optimizer: optimizer, milestones: [60], gamma: 0.1, save_as: scheduler}}
  - block: epoch_loop
    params: {epochs: 100}
    steps:
      - {block: refresh_epoch_loader, params: {data: prepared_data, role: train, batch_size: 128, save_as: train_loader}}
      - {block: cal_confidence_schedule, params: {default: 1.0, milestones: [10, 40, 80], values: [0.0, 1.0, 1.0], save_as: confidence_weight}}
      - {block: cal_reset_reference_accumulator, params: {state: cal_state}}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - {block: zero_grad}
          - {block: forward}
          - {block: cal_prepare_proxy_batch, params: {indices: indices, state: cal_state}}
          - {block: cal_cores2_adjusted_risk, params: {logits: logits, labels: labels, noisy_prior: cal_noisy_prior, confidence_weight: confidence_weight, save_as: cal_adjusted_risk}}
          - {block: cal_covariance_correction, params: {logits: logits, labels: labels, proxy_targets: cal_proxy_targets, retained: cal_retained, proxy_prior: cal_proxy_prior, reference_losses: cal_reference_losses, reference_transition: cal_reference_transition, save_as: cal_covariance}}
          - {block: subtract_objectives, params: {minuend: cal_adjusted_risk, subtrahend: cal_covariance, save_as: loss}}
          - {block: cal_accumulate_reference_losses, params: {state: cal_state, logits: logits, proxy_targets: cal_proxy_targets, retained: cal_retained}}
          - {block: backward}
          - {block: optimizer_step}
      - {block: cal_finalize_reference_losses, params: {state: cal_state}}
      - {block: cal_confidence_schedule, params: {default: 1.0, milestones: [10, 40, 80], values: [0.0, 1.0, 1.0], epoch_offset: 1, save_as: next_confidence_weight}}
      - {block: alpha_scaled_scheduler_step, params: {scheduler: scheduler, confidence_weight: next_confidence_weight}}
      - {block: evaluate_accuracy, params: {model: model, loader: validation_loader, save_as: validation_accuracy}}
  - {block: evaluate_accuracy, params: {model: model, loader: test_loader, save_as: test_accuracy, final: true}}
