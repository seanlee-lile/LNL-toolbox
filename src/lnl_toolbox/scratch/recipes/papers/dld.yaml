schema_version: 1
name: dld
description: "Formal DLD CIFAR-10 symmetric-20 recipe with strong-augmentation-compatible data, frozen feature direction, label diffusion, and 200 epochs."
steps:
  - {block: set_seed, params: {seed: 123}}
  - {block: select_device, params: {device: auto}}
  - {block: load_dataset, params: {dataset: cifar10}}
  - {block: inspect_dataset_semantics}
  - {block: create_dataset_split, params: {validation_size: 5000, split_seed: 123}}
  - {block: select_label_source, params: {validation: observed}}
  - {block: apply_noise, params: {name: symmetric, rate: 0.2, seed: 123}}
  - {block: build_noise_manifest}
  - {block: configure_preprocessing, params: {preprocessing: standard, augment: true}}
  - {block: configure_views, params: {views: [weak, strong]}}
  - {block: assign_data_roles, params: {roles: [train, noisy_validation, test]}}
  - {block: configure_loader, params: {batch_size: 200, num_workers: 4, pin_memory: true}}
  - {block: build_prepared_data}
  - {block: build_loaders}
  - {block: create_model, params: {model: resnet34, num_classes: 10, base_width: 64, device: device, save_as: model}}
  - {block: create_predictor, params: {input_dim: 512, output_dim: 10, hidden_dim: 64, conditioning_dim: 20, time_dim: 16, device: device, save_as: direction_predictor}}
  - {block: create_predictor, params: {input_dim: 512, output_dim: 10, hidden_dim: 64, conditioning_dim: 20, time_dim: 16, device: device, save_as: noise_predictor}}
  - {block: create_optimizer, params: {optimizer: adam, model: direction_predictor, lr: 0.0001, save_as: direction_optimizer}}
  - {block: create_optimizer, params: {optimizer: adam, model: noise_predictor, lr: 0.0001, save_as: noise_optimizer}}
  - {block: create_model_ema, params: {model: direction_predictor, momentum: 0.999, save_as: direction_ema}}
  - {block: create_model_ema, params: {model: noise_predictor, momentum: 0.999, save_as: noise_ema}}
  - block: epoch_loop
    params: {epochs: 200}
    steps:
      - {block: refresh_epoch_loader, params: {data: prepared_data, role: train, batch_size: 200, save_as: train_loader}}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - {block: forward_feature}
          - {block: one_hot, params: {labels: labels, num_classes: 10, save_as: y0}}
          - {block: softmax, params: {logits: logits, detach: true, save_as: yn}}
          - {block: subtract, params: {minuend: yn, subtrahend: y0, save_as: direction}}
          - {block: sample_timestep_noise, params: {reference: y0, timesteps: 1000, timestep_as: timestep, noise_as: epsilon}}
          - {block: dld_sample_forward_state, params: {y0: y0, direction: direction, timestep: timestep, epsilon: epsilon, timesteps: 1000, save_as: yd}}
          - {block: zero_grad, params: {optimizer: direction_optimizer}}
          - {block: zero_grad, params: {optimizer: noise_optimizer}}
          - {block: module_forward, params: {module: direction_predictor, inputs: [yd, yn, features, timestep], save_as: predicted_direction}}
          - {block: module_forward, params: {module: noise_predictor, inputs: [yd, yn, features, timestep], save_as: predicted_noise}}
          - {block: mean_squared_error, params: {predicted: predicted_direction, target: direction, reduction: scalar, save_as: direction_loss}}
          - {block: mean_squared_error, params: {predicted: predicted_noise, target: epsilon, reduction: scalar, save_as: noise_loss}}
          - {block: weighted_sum, params: {terms: [direction_loss, noise_loss], weights: [1.0, 1.0], save_as: loss}}
          - {block: backward}
          - {block: optimizer_step, params: {optimizer: direction_optimizer}}
          - {block: optimizer_step, params: {optimizer: noise_optimizer}}
          - {block: update_model_ema, params: {model: direction_predictor, ema: direction_ema}}
          - {block: update_model_ema, params: {model: noise_predictor, ema: noise_ema}}
  - {block: dld_accelerated_inference, params: {feature_model: model, direction: direction_ema, noise: noise_ema, loader: test_loader, timesteps: 1000, steps: 5, save_as: test_accuracy}}
