schema_version: 1
name: dld
description: "Formal DLD CIFAR-10 symmetric-20 recipe with strong-augmentation-compatible data, frozen feature direction, label diffusion, and 200 epochs."
settings:
  # The predictors are initialised lazily inside the batch loop; declaring the
  # slots here keeps the top-level recipe contract explicit for validation.
  direction_predictor: null
  noise_predictor: null
steps:
  - {block: set_seed, params: {seed: 123}}
  - {block: select_device, params: {device: auto}}
  - {block: load_dataset, params: {dataset: cifar10}}
  - {block: inspect_dataset_semantics}
  - {block: create_dataset_split, params: {validation_size: 5000, split_seed: 123}}
  - {block: select_label_source, params: {validation: observed}}
  - {block: apply_noise, params: {name: symmetric, rate: 0.2, seed: 123}}
  - {block: build_noise_manifest}
  - {block: configure_preprocessing, params: {preprocessing: standard, augment: true}}
  - {block: configure_views, params: {views: [weak, strong]}}
  - {block: assign_data_roles, params: {roles: [train, noisy_validation, test]}}
  - {block: configure_loader, params: {batch_size: 200, num_workers: 4, pin_memory: true}}
  - {block: build_prepared_data}
  - {block: build_loaders}
  - {block: create_model, params: {model: resnet34, num_classes: 10, base_width: 64, device: device, save_as: model}}
  - block: epoch_loop
    params: {epochs: 200}
    steps:
      - {block: refresh_epoch_loader, params: {data: prepared_data, role: train, batch_size: 200, save_as: train_loader}}
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - {block: forward_feature}
          - {block: dld_onehot_start, params: {labels: labels, num_classes: 10, save_as: y0}}
          - {block: dld_estimate_endpoint, params: {logits: logits, save_as: yn}}
          - {block: dld_construct_direction, params: {y0: y0, yn: yn, save_as: direction}}
          - {block: dld_sample_timestep_noise, params: {reference: y0, timesteps: 1000, timestep_as: timestep, noise_as: epsilon}}
          - {block: dld_sample_forward_state, params: {y0: y0, direction: direction, timestep: timestep, epsilon: epsilon, timesteps: 1000, save_as: yd}}
          - {block: dld_ensure_independent_predictors, params: {features: features, num_classes: 10, hidden_dim: 64, time_dim: 16, learning_rate: 0.0001}}
          - {block: zero_grad, params: {optimizer: direction_optimizer}}
          - {block: zero_grad, params: {optimizer: noise_optimizer}}
          - {block: dld_predict_quantity, params: {predictor: direction_predictor, state: yd, endpoint: yn, features: features, timestep: timestep, save_as: predicted_direction}}
          - {block: dld_predict_quantity, params: {predictor: noise_predictor, state: yd, endpoint: yn, features: features, timestep: timestep, save_as: predicted_noise}}
          - {block: dld_direction_loss, params: {predicted: predicted_direction, target: direction, save_as: dld_direction_loss}}
          - {block: dld_noise_loss, params: {predicted: predicted_noise, target: epsilon, save_as: dld_noise_loss}}
          - {block: dld_objective_composition, params: {direction_loss: dld_direction_loss, noise_loss: dld_noise_loss, save_as: loss}}
          - {block: backward}
          - {block: optimizer_step, params: {optimizer: direction_optimizer}}
          - {block: optimizer_step, params: {optimizer: noise_optimizer}}
          - {block: dld_update_ema, params: {direction: direction_predictor, noise: noise_predictor, decay: 0.999}}
  - {block: dld_accelerated_inference, params: {feature_model: model, direction: direction_predictor, noise: noise_predictor, loader: test_loader, timesteps: 1000, steps: 5, save_as: test_accuracy}}
