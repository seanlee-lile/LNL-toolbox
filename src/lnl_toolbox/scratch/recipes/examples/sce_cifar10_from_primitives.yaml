schema_version: 1
name: sce_cifar10_from_primitives
description: >-
  SCE (Wang et al., ICCV 2019), Section 5.1 CIFAR-10 / 40% symmetric-noise
  demonstration. Its CE + RCE loss is assembled from shared Scratch operations.
  Batch size 128 is an explicit local choice, not specified in Section 5.1.
steps:
  - {block: set_seed, params: {seed: 1}}
  - {block: select_device, params: {device: auto}}
  - {block: load_dataset, params: {dataset: cifar10}}
  - {block: inspect_dataset_semantics}
  - {block: create_dataset_split, params: {validation_size: 0, split_seed: 1}}
  - {block: select_label_source}
  - {block: apply_noise, params: {name: symmetric, rate: 0.4, seed: 1}}
  - {block: build_noise_manifest}
  - {block: configure_preprocessing, params: {preprocessing: standard, augment: true}}
  - {block: configure_views, params: {views: [weak]}}
  - {block: assign_data_roles, params: {roles: [train, test]}}
  - {block: configure_loader, params: {batch_size: 128, num_workers: 0}}
  - {block: build_prepared_data}
  - {block: build_loaders}
  - {block: create_model, params: {model: cifar_cnn8, num_classes: 10, device: device}}
  - block: create_optimizer
    params: {optimizer: sgd, model: model, lr: 0.01, momentum: 0.9, weight_decay: 0.0001}
  - block: create_scheduler
    params: {scheduler: multistep, optimizer: optimizer, milestones: [40, 80], gamma: 0.1}
  - block: epoch_loop
    params: {epochs: 120}
    steps:
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: move_batch_to_device}
          - {block: zero_grad}
          - {block: forward}
          # CE_i = -log(max(softmax(logits)_y, 1e-12)).
          - {block: softmax, params: {logits: logits, save_as: sce_probabilities}}
          - {block: clamp_min, params: {input: sce_probabilities, minimum: 1.0e-12, save_as: sce_clamped_probabilities}}
          - {block: gather_by_label, params: {values: sce_clamped_probabilities, labels: labels, save_as: sce_label_probability}}
          - {block: log, params: {input: sce_label_probability, save_as: sce_log_label_probability}}
          - {block: negate, params: {input: sce_log_label_probability, save_as: sce_ce_per_sample}}
          # RCE_i = -sum_c p_ic log(q_ic), with log(0) = A = -6.
          - {block: one_hot, params: {labels: labels, num_classes: 10, save_as: sce_one_hot}}
          - {block: ones_like, params: {input: sce_one_hot, save_as: sce_ones}}
          - {block: subtract, params: {minuend: sce_ones, subtrahend: sce_one_hot, save_as: sce_non_target_mask}}
          - {block: affine_transform, params: {input: sce_non_target_mask, scale: -6.0, bias: 0.0, save_as: sce_log_targets}}
          - {block: elementwise_multiply, params: {left: sce_probabilities, right: sce_log_targets, save_as: sce_rce_terms}}
          - {block: reduce_sum, params: {input: sce_rce_terms, dim: -1, save_as: sce_rce_sum}}
          - {block: negate, params: {input: sce_rce_sum, save_as: sce_rce_per_sample}}
          # SL_i = 0.1 CE_i + RCE_i.
          - {block: affine_transform, params: {input: sce_ce_per_sample, scale: 0.1, bias: 0.0, save_as: sce_scaled_ce}}
          - {block: add, params: {left: sce_scaled_ce, right: sce_rce_per_sample, save_as: sce_loss_per_sample}}
          - {block: mean_loss, params: {input: sce_loss_per_sample, save_as: loss}}
          - {block: backward, params: {loss: loss}}
          - {block: optimizer_step}
      - {block: scheduler_step, params: {scheduler: scheduler}}
      - {block: evaluate_accuracy, params: {model: model, loader: test_loader, save_as: epoch_test_accuracy}}
  - {block: evaluate_accuracy, params: {model: model, loader: test_loader, save_as: final_test_accuracy, final: true}}
  - {block: record_metrics, params: {values: [final_test_accuracy]}}
