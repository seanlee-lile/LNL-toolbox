schema_version: 1
name: gce_small_loss_synthetic
description: One-epoch GCE plus small-loss training smoke recipe.
steps:
  - block: set_seed
    params:
      seed: 1
  - block: select_device
    params:
      device: cpu
  - block: load_synthetic
    params:
      samples: 64
      features: 4
      classes: 2
  - block: create_loader
    params:
      dataset: train_dataset
      batch_size: 16
      shuffle: true
  - block: create_model
    params:
      model: mlp
      num_classes: 2
      input_dim: 4
      device: device
  - block: create_optimizer
    params:
      optimizer: sgd
      model: model
      lr: 0.1
  - block: set_value
    params:
      value: 0.8
      save_as: keep_rate
  - block: epoch_loop
    params:
      epochs: 1
    steps:
      - block: batch_loop
        params:
          loader: train_loader
        steps:
          - block: get_batch
          - block: zero_grad
          - block: forward
          - block: gce_loss
            params:
              q: 0.7
          - block: select_lowest_scores
            params:
              scores: loss_per_sample
              keep_fraction: keep_rate
              stable_sample_indices: indices
              rounding: ceil
              minimum_count: 1
              save_as: selected_indices
          - block: select_by_indices
            params:
              values: loss_per_sample
              indices: selected_indices
              save_as: selected_loss
          - block: mean_by_indices
            params:
              values: loss_per_sample
              indices: selected_indices
              save_as: loss
          - block: backward
          - block: optimizer_step
  - block: record_metrics
    params:
      values: [loss]
