schema_version: 1
name: new_algorithm
description: Scratch default supervised skeleton

steps:
  - block: set_seed
    params:
      seed: 1

  - block: select_device
    params:
      device: cpu

  - block: load_dataset
    params: {dataset: synthetic, options: {samples: 64, features: 4, classes: 2}}
  - block: inspect_dataset_semantics
  - block: create_dataset_split
    params: {validation_size: 0}
  - block: select_label_source
    params: {validation: observed, test: observed}
  - block: apply_noise
    params: {name: none, rate: 0.0, seed: 1}
  - block: build_noise_manifest
    params: {required: false}
  - block: configure_preprocessing
    params: {preprocessing: tensor_only}
  - block: configure_views
    params: {views: [weak]}
  - block: assign_data_roles
    params: {roles: [train, test]}
  - block: configure_loader
    params: {batch_size: 128}
  - block: build_prepared_data
  - block: build_loaders

  - block: create_model
    params:
      model: resnet18
      save_as: model

  - block: create_optimizer
    params:
      optimizer: sgd
      model: model
      lr: 0.1
      save_as: optimizer

  - block: epoch_loop
    params:
      epochs: 200
    steps:
      - block: batch_loop
        params:
          loader: train_loader
        steps:
          - block: get_batch

  - block: evaluate_accuracy
    params:
      model: model
      loader: train_loader
      save_as: accuracy
