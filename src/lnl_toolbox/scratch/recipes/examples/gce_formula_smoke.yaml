schema_version: 1
name: gce_formula_smoke
description: One-epoch GCE formula-block smoke test; not a paper reproduction configuration.
steps:
  - block: set_seed
    params: {seed: 1}
  - block: select_device
    params: {device: cpu}
  - block: load_synthetic
    params: {samples: 64, features: 4, classes: 2}
  - block: create_loader
    params: {dataset: train_dataset, batch_size: 16, shuffle: true}
  - block: create_model
    params: {model: mlp, num_classes: 2, input_dim: 4, device: device}
  - block: create_optimizer
    params: {optimizer: sgd, model: model, lr: 0.1}
  - block: epoch_loop
    params: {epochs: 1}
    steps:
      - block: batch_loop
        params: {loader: train_loader}
        steps:
          - {block: get_batch}
          - {block: zero_grad}
          - {block: forward}
          - block: softmax
          - block: gather_by_label
            params: {values: probabilities, labels: labels, save_as: target_probability}
          - block: clamp_min
            params: {input: target_probability, minimum: 1.0e-12, save_as: clamped_target_probability}
          - block: elementwise_power
            params: {input: clamped_target_probability, q: 0.7, save_as: powered_target_probability}
          - block: affine_transform
            params: {input: powered_target_probability, scale: -1.4285714285714286, bias: 1.4285714285714286, save_as: loss_per_sample}
          - {block: mean_loss}
          - {block: backward}
          - {block: optimizer_step}
  - block: record_metrics
    params: {values: [loss]}
