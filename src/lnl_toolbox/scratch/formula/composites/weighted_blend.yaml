id: builtin/weighted_blend
name: Weighted Blend
description: Blend two operands with an explicitly bounded sample weight.
inputs:
  left: {type: tensor}
  right: {type: tensor}
  weight: {type: tensor}
steps:
  - id: one
    block: ones_like
    bindings: {input: weight}
  - id: zero
    block: zeros_like
    bindings: {input: weight}
  - id: upper
    block: minimum
    bindings: {left: weight, right: one}
  - id: bounded
    block: maximum
    bindings: {left: upper, right: zero}
  - id: complement
    block: subtract
    bindings: {minuend: one, subtrahend: bounded}
  - id: bounded_row
    block: unsqueeze
    bindings: {input: bounded}
    parameters: {dim: -1}
  - id: complement_row
    block: unsqueeze
    bindings: {input: complement}
    parameters: {dim: -1}
  - id: left_part
    block: elementwise_multiply
    bindings: {left: bounded_row, right: left}
  - id: right_part
    block: elementwise_multiply
    bindings: {left: complement_row, right: right}
  - id: blended
    block: add
    bindings: {left: left_part, right: right_part}
outputs:
  blended: {source: blended}
