id: builtin/mean_squared_error
name: Mean Squared Error
description: Elementwise subtraction, power and global mean.
metadata:
  oracle_branches:
    mask: "optional slot name; select rows before the reduction"
    reduction: "per_sample or scalar"
inputs:
  predicted: {type: tensor}
  target: {type: tensor}
steps:
  - id: difference
    block: subtract
    bindings: {minuend: predicted, subtrahend: target}
  - id: squared
    block: elementwise_power
    bindings: {input: difference}
    parameters: {q: 2.0}
  - id: loss
    block: reduce_mean
    bindings: {input: squared}
outputs:
  loss: {source: loss}
