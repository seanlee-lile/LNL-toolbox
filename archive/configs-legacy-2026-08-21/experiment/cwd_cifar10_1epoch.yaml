seed: 17
output_root: artifacts/reproductions/cwd-cifar10-1epoch

data:
  name: cifar10_airplane_automobile
  root: data/cifar10
  folds: 5
  fold_index: 0
  augment: false

noise:
  rho_positive: 0.2
  rho_negative: 0.2
  seed: 17

loader:
  batch_size: 128
  num_workers: 0
  pin_memory: true

model: {name: cifar_resnet34, base_width: 64}
optimizer: {name: adam, lr: 0.05, weight_decay: 0.0001}
scheduler: {milestones: [40, 120], gamma: 0.1}
trainer: {epochs: 1, device: auto}
cwd: {ridge: 1.0e-8}
execution: {runner: cwd}
