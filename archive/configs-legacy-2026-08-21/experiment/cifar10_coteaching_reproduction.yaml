# Real CIFAR-10 full-budget Co-teaching usability workflow with symmetric 20% noise.
# This engineering profile uses the existing CifarCnn8 model, not the paper's
# exact 9-layer CNN, and does not claim last-ten or five-run numerical reproduction.
method: coteaching
execution:
  runner: coteaching
configuration_fidelity: engineering
seed: 1
output_root: artifacts/reproductions/coteaching-cifar10-sym20
data:
  name: cifar10
  root: data/cifar10
  validation_size: 5000
  validation_split:
    strategy: stratified
    rng: default_rng
  augment: true
  preprocessing: standard
noise:
  name: symmetric
  rate: 0.2
  seed: 1
  sampling: transition
  rng: default_rng
  validation_targets: noisy
  manifest_filename: noise_manifest.npz
model:
  name: cifar_cnn8
optimizer:
  name: adam
  lr: 0.001
  weight_decay: 0.0
scheduler:
  name: none
coteaching:
  model_count: 2
  noise_rate: 0.2
  initialization:
    peer_seed_offset: 1
  remember_schedule:
    name: linear
    start: 1.0
    end: 0.8
    gradual_epochs: 10
  selection:
    count_rule: floor
    tie_break: stable_sample_index
loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true
evaluation:
  selection_split: validation
  primary: mean_peer_accuracy
  ensemble: mean_probabilities
trainer:
  epochs: 200
  device: auto
