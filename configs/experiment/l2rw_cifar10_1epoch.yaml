schema_version: 1
kind: experiment
method: l2rw
execution:
  runner: l2rw
seed: 1234
output_root: artifacts/reproductions/l2rw-cifar10-1epoch
data:
  name: cifar10
  validation_size: 1000
  augment: true
noise:
  rate: 0.4
  seed: 1234
  sampling: per_class
  rng: default_rng
  name: symmetric
loader:
  batch_size: 100
  num_workers: 0
  pin_memory: true
trusted_validation:
  source: audited_manifest
  manifest: data/trusted/l2rw_cifar10_balanced_1000.npz
  batch_size: 100
  seed: 1234
model:
  name: resnet32
  base_width: 16
optimizer:
  name: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0002
scheduler:
  name: none
  step_milestones:
  - 40000
  - 60000
  gamma: 0.1
meta:
  virtual_learning_rate: 0.1
trainer:
  epochs: 1
  max_steps: 0
  device: auto
