method: mc_ldce
execution: {runner: mc_ldce}
seed: 1
output_root: artifacts/reproductions/mc-ldce-cifar10-1epoch
data: {name: cifar10, root: data/cifar10, validation_size: 0, augment: true}
noise: {type: symmetric, rate: 0.2, seed: 1, sampling: per_class, rng: default_rng}
loader: {batch_size: 128, num_workers: 0, pin_memory: true}
model: {name: mc_ldce_cnn}
optimizer: {name: adam, lr: 0.001, beta1: 0.9, beta2: 0.999, weight_decay: 0.0}
scheduler: {name: linear_after, decay_start: 80}
warmup: {epochs: 0}
transition:
  estimator: paper_volmin
  num_classes: 10
  epochs: 1
  lambda_volume: 0.001
  determinant_tolerance: 1.0e-8
  condition_limit: 1.0e8
  optimizer: {name: adamw, model_lr: 0.001, transition_lr: 0.001, weight_decay: 0.0}
  parameterization: {initial_flip_mass: 0.1, max_flip_mass: 0.49, temperature: 1.0, seed: 1}
statistics: {rcond: 1.0e-8, condition_limit: 1.0e8}
trainer: {epochs: 1, device: auto}
