seed: 1
output_root: artifacts/reproductions

data:
  name: cifar10
  root: data/cifar10
  max_train_samples: null
  max_test_samples: null
  preprocessing: standard
  augment: false

noise:
  name: pdl
  rate: 0.4
  seed: 1
  manifest_filename: noise_manifest.npz

warmup:
  epochs: 100
  noisy_validation_size: 5000
  loss: {name: ce}
  optimizer:
    name: sgd
    lr: 0.01
    momentum: 0.9
    nesterov: false
    weight_decay: 0.0001
  scheduler:
    name: multistep
    milestones: [40, 80]
    gamma: 0.1

instance_transition:
  name: pdl
  num_parts: 20
  factorization:
    iterations: 10
    seed: 1
  anchors:
    candidates_per_class: 20

algorithm:
  name: corrected_classification
  correction: forward

loss: {name: ce}
model:
  name: resnet34
  base_width: 64
optimizer:
  name: sgd
  lr: 0.01
  momentum: 0.9
  nesterov: false
  weight_decay: 0.0001
scheduler:
  name: multistep
  milestones: [40, 80]
  gamma: 0.1
loader:
  batch_size: 128
  num_workers: 0
  pin_memory: true
  drop_last: false
trainer:
  epochs: 100
  device: auto
  progress: {curves: true}
