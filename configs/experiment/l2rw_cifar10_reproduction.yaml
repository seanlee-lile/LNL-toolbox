method: l2rw
execution: {runner: l2rw}
seed: 1234
output_root: artifacts/reproductions/l2rw-cifar10-uniform40
data: {name: cifar10, root: data/cifar10, validation_size: 5100, augment: true}
noise: {type: symmetric, rate: 0.4, seed: 1234, sampling: per_class, rng: default_rng}
loader: {batch_size: 100, num_workers: 4, pin_memory: true}
trusted_validation:
  source: audited_manifest
  manifest: data/trusted/l2rw_cifar10_balanced_100.npz
  batch_size: 100
  seed: 1234
model: {name: resnet32, base_width: 16}
optimizer: {name: sgd, lr: 0.1, momentum: 0.9, weight_decay: 0.0002}
scheduler: {name: none, step_milestones: [40000, 60000], gamma: 0.1}
meta: {virtual_learning_rate: 0.1}
trainer: {epochs: 180, max_steps: 80000, device: auto}
