seed: 1
output_root: artifacts/test-runs

data:
  name: cifar10
  root: data/cifar10
  max_train_samples: 300
  max_test_samples: 100
  preprocessing: standard
  augment: false

noise:
  name: pdl
  rate: 0.4
  seed: 1
  manifest_filename: noise_manifest.npz

warmup:
  epochs: 1
  noisy_validation_size: 60
  loss: {name: ce}
  optimizer:
    name: sgd
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0001
  scheduler: {name: none}

instance_transition:
  name: pdl
  num_parts: 2
  factorization: {iterations: 3, seed: 1}
  anchors: {candidates_per_class: 3}
  basis_epochs: 3
  basis_learning_rate: 0.001
  basis_loss_threshold: 0.0

algorithm:
  name: corrected_classification
  correction: forward

loss: {name: ce}
model: {name: tiny_cnn, width: 16}
optimizer:
  name: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
scheduler:
  name: multistep
  milestones: [1]
  gamma: 0.1
loader:
  batch_size: 32
  num_workers: 0
  pin_memory: false
  drop_last: false
trainer:
  epochs: 2
  device: auto
  progress: {curves: true}
execution: {runner: instance_transition}
