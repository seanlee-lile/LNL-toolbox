method: volmin
execution: {runner: volmin}
seed: 41
output_root: artifacts/reproductions/volmin-cifar10-symmetric04
data: {name: cifar10, root: data/cifar10, validation_size: 5000, split_strategy: stratified, split_rng: default_rng, augment: true}
noise: {name: symmetric, rate: 0.4, seed: 43, sampling: transition, rng: default_rng, validation_targets: noisy, manifest_filename: noise_manifest.npz}
volminnet:
  fidelity: paper_positive_logdet
  model: {name: resnet18}
  transition:
    parameterization: fixed_diagonal_sigmoid_offdiag
    convention: clean_to_noisy_row
    normalization_axis: row
    initialization: {mode: paper}
  objective:
    classification: noisy_nll
    volume: {mode: positive_logdet, coefficient: 0.0001}
  optimizer:
    classifier: {name: sgd, lr: 0.01, momentum: 0.9, weight_decay: 0.001}
    transition: {name: sgd, lr: 0.01, momentum: 0.9, weight_decay: 0.001}
  scheduler:
    classifier: {name: multistep, milestones: [30, 60], gamma: 0.1}
    transition: {name: multistep, milestones: [30, 60], gamma: 0.1}
  checkpoint_selection: {split: noisy_validation, metric: loss, mode: min}
loader: {batch_size: 128, num_workers: 4, pin_memory: true}
trainer: {epochs: 150, device: cuda}
