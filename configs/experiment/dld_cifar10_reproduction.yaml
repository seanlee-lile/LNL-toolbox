method: dld
execution: {runner: dld}
seed: 123
output_root: artifacts/reproductions/dld-cifar10-idn20
data:
  name: cifar10
  root: data/cifar10
  validation_size: 5000
  strong_augment: true
  strong_magnitude: 10
  normalization:
    mean: [0.4914, 0.4822, 0.4465]
    std: [0.2023, 0.1994, 0.2010]
noise: {name: symmetric, rate: 0.2, seed: 123, sampling: per_class, rng: default_rng, validation_targets: noisy}
loader: {batch_size: 200, num_workers: 0, pin_memory: false, drop_last: false}
dld:
  fidelity:
    name: paper_oriented_v1
    hard_y0: averaged_views
    direction_endpoint: estimated_yn
    direction: yn_minus_y0
    neighbor_metric: cosine_distance
    self_neighbor: include
    divergence: kl_ps_to_pw
    divergence_softmax: false
    hard_yn_zero_denominator: fail
    schedule: average
    inference_initialization: zero
    inference_steps: 5
  feature_extractor:
    source: repository_frozen_model
    model: {name: resnet34, base_width: 64}
  precorrection: {k_neighbors: 50, delta: 1.0e-6, gmm_components: 2, gmm_seed: 0, minimum_mean_separation: 1.0e-6}
  diffusion:
    timesteps: 1000
    epochs: 200
    model: {independent_predictors: true, hidden_dim: 512, time_dim: 64}
    optimizer:
      direction: {name: adam, lr: 0.0001}
      noise: {name: adam, lr: 0.0001}
    scheduler:
      direction: {name: none}
      noise: {name: none}
    ema: {enabled: true, decay: 0.999}
  inference: {steps: 5, deterministic: true, initialization: zero}
evaluation: {selection_split: validation, primary: accuracy}
trainer: {device: auto}
