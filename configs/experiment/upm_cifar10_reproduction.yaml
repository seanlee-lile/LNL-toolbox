method: upm
execution: {runner: upm}
seed: 1
output_root: artifacts/reproductions/upm-cifar10-idn
data: {name: cifar10, root: data/cifar10, validation_size: 5000, split_strategy: stratified, split_rng: default_rng, augment: true}
noise: {name: symmetric, rate: 0.4, seed: 1, sampling: per_class, rng: default_rng, validation_targets: noisy}
loader: {batch_size: 128, num_workers: 4, pin_memory: true, drop_last: false}
upm:
  stage1:
    epochs: 160
    model: {name: resnet32}
    optimizer: {name: sgd, lr: 0.05, momentum: 0.9, weight_decay: 0.0001}
    scheduler: {name: multistep, milestones: [40, 80, 120], gamma: 0.1}
    best_metric: noisy_validation_accuracy
  psi: {source: stage1_best, split: train, augmentation: false}
  main:
    epochs: 160
    initialization: fresh
    model: {name: resnet32}
    optimizer: {name: sgd, lr: 0.05, momentum: 0.9, weight_decay: 0.0001}
    scheduler: {name: multistep, milestones: [40, 80, 120], gamma: 0.1}
  confusing_probability:
    initial_value: 0.01
    learning_rate: 0.7
    epsilon: 0.0001
    update_start_epoch: 35
    update_interval_epochs: 5
evaluation: {selection_split: validation, primary: accuracy}
trainer: {device: cuda}
