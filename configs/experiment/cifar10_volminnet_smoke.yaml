schema_version: 1
kind: experiment
method: volminnet
execution:
  runner: volminnet
seed: 41
output_root: artifacts/runs
data:
  name: cifar10
  validation_size: 5000
  max_train_samples: 128
  max_validation_samples: 64
  max_test_samples: 64
  augment: false
noise:
  name: symmetric
  rate: 0.4
  seed: 43
  sampling: transition
  rng: default_rng
  validation_targets: noisy
  manifest_filename: noise_manifest.npz
volminnet:
  fidelity: paper_positive_logdet
  model:
    name: tiny_cnn
    width: 8
  transition:
    parameterization: fixed_diagonal_sigmoid_offdiag
    convention: clean_to_noisy_row
    normalization_axis: row
    initialization:
      mode: paper
  objective:
    classification: noisy_nll
    volume:
      mode: positive_logdet
      coefficient: 0.0001
  optimizer:
    classifier:
      name: sgd
      lr: 0.01
      momentum: 0.9
      weight_decay: 0.001
    transition:
      name: sgd
      lr: 0.01
      momentum: 0.9
      weight_decay: 0.001
  scheduler:
    classifier:
      name: none
    transition:
      name: none
  checkpoint_selection:
    split: noisy_validation
    metric: loss
    mode: min
loader:
  batch_size: 32
  num_workers: 0
  pin_memory: false
trainer:
  epochs: 2
  device: cpu
