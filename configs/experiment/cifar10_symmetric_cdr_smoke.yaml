seed: 7
output_root: artifacts/runs
data:
  name: cifar10
  root: data/cifar10
  validation_size: 5000
  max_train_samples: 512
  max_validation_samples: 256
  max_test_samples: 256
  augment: true
  validation_split:
    strategy: random
    rng: numpy_legacy
  normalization:
    mean: [0.4914, 0.4822, 0.4465]
    std: [0.2023, 0.1994, 0.2010]
noise:
  name: symmetric
  rate: 0.4
  seed: 7
  sampling: transition
  rng: numpy_legacy
  validation_targets: noisy
  manifest_filename: noise_manifest.npz
loss:
  name: ce
selector:
  name: all
parameter_update:
  name: cdr
  noise_rate: 0.4
  l1_decay: 0.001
  critical_scope: all_trainable
  compatibility_mode: paper
loader:
  batch_size: 128
  num_workers: 0
  pin_memory: true
model:
  name: tiny_cnn
  width: 32
optimizer:
  name: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0
scheduler:
  name: cosine
  t_max: 3
trainer:
  epochs: 2
  device: auto
evaluation:
  selection_split: validation
