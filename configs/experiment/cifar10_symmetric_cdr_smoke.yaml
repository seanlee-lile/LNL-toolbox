seed: 7
output_root: artifacts/runs
data:
  name: cifar10
  root: data/cifar10
  validation_size: 5000
  max_train_samples: 512
  max_validation_samples: 256
  max_test_samples: 256
  augment: true
noise:
  name: symmetric
  rate: 0.4
  seed: 17
  manifest_filename: noise_manifest.npz
loss:
  name: ce
selector:
  name: all
parameter_update:
  name: cdr
  noise_rate: 0.4
  l1_decay: 0.001
  critical_scope: all_trainable
  compatibility_mode: paper
loader:
  batch_size: 128
  num_workers: 0
  pin_memory: true
model:
  name: tiny_cnn
  width: 32
optimizer:
  name: sgd
  lr: 0.01
  # Strict paper-equation updates require no historical loss-gradient momentum.
  momentum: 0.0
  weight_decay: 0.0
scheduler:
  name: cosine
  t_max: 3
trainer:
  epochs: 2
  device: auto
execution: {runner: supervised}
