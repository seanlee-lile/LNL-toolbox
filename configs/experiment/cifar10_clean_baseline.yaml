seed: 1
output_root: artifacts/runs
data:
  name: cifar10
  root: data/cifar10
  validation_size: 5000
  max_train_samples: null
  max_validation_samples: null
  max_test_samples: null
  augment: true
loader:
  batch_size: 128
  num_workers: 0
  pin_memory: true
model:
  name: preact_resnet18
  base_width: 64
loss:
  name: ce
optimizer:
  name: sgd
  lr: 0.1
  momentum: 0.9
  nesterov: true
  weight_decay: 0.0005
scheduler:
  name: cosine
  t_max: 200
  eta_min: 0.000001
trainer:
  epochs: 200
  device: auto
