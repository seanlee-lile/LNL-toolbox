method: importance_reweighting
num_classes: 2
label_convention: zero_one
seed: 17

data:
  name: synthetic_binary_high_dim
  dimension: 20
  train_size: 128
  validation_size: 64
  test_size: 64

noise:
  name: binary_asymmetric_rcn
  rho_positive: 0.20
  rho_negative: 0.10
  seed: 29
  validation_targets: noisy

posterior_stage:
  name: kliep
  # Fixed KLIEP tuning values are implementation choices for this tiny smoke.
  bandwidth: 4.0
  max_centers: 24
  max_iterations: 200
  learning_rate: 0.02
  tolerance: 1.0e-7
  epsilon: 1.0e-12
  seed: 37
  rate_estimator: paper_raw_min

model:
  name: linear
  in_features: 20
  num_classes: 2

loss:
  name: ce

optimizer:
  name: sgd
  lr: 0.05
  momentum: 0.0
  weight_decay: 0.0

scheduler:
  name: none

loader:
  batch_size: 32
  num_workers: 0
  pin_memory: false

trainer:
  epochs: 2
  device: cpu

evaluation:
  selection_split: validation

output_root: artifacts/runs
