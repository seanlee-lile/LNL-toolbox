seed: 1
output_root: artifacts/reproductions

parameter_sampling:
  paper: jocor
  seed: 20260728
  candidates:
    setting:
      - {noise: symmetric, rate: 0.2, lambda: 0.9}
      - {noise: symmetric, rate: 0.5, lambda: 0.9}
      - {noise: symmetric, rate: 0.8, lambda: 0.65}
      - {noise: asymmetric, rate: 0.4, lambda: 0.9}
    train_seed: [1]
  sources:
    setting: CVPR 2020 paper and official JoCoR README
    train_seed: official main.py default

data:
  name: cifar10
  root: data/cifar10
  validation_size: 0
  preprocessing: tensor_only
  augment: false

noise:
  name: symmetric
  rate: 0.5
  seed: 0
  sampling: transition
  rng: numpy_legacy

loss:
  name: ce

algorithm:
  name: jocor
  lambda: 0.9

selector:
  name: small_loss
  rounding: floor
  keep_rate:
    name: linear
    start: 1.0
    end: 0.5
    # np.linspace uses ten endpoints for official num_gradual=10.
    warmup_epochs: 9

models:
  - name: cifar_six_conv
    batch_norm_momentum: 0.1
  - name: cifar_six_conv
    batch_norm_momentum: 0.1

optimizer:
  name: adam
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 0.0

scheduler:
  name: linear_decay
  start_epoch: 80
  end_epoch: 200
  initial_lr: 0.001
  final_lr: 0.0
  beta1_before: 0.9
  beta1_after: 0.1

loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true
  drop_last: true

trainer:
  epochs: 200
  device: auto
  progress:
    enabled: true
    update_interval: 50
    curves: true

evaluation:
  selection_split: test
  allow_test_selection: true
  report_last_epochs: 10
