schema_version: 1
kind: experiment
method: dividemix
seed: 7
output_root: artifacts/runs
data:
  name: cifar10
  validation_size: 5000
  max_train_samples: 256
  max_validation_samples: 128
  max_test_samples: 128
  augment: false
noise:
  name: symmetric
  rate: 0.2
  seed: 17
  validation_targets: noisy
  manifest_filename: noise_manifest.npz
model:
  name: tiny_cnn
  width: 16
optimizer:
  name: adam
  lr: 0.001
  weight_decay: 0.0
scheduler:
  name: none
loader:
  batch_size: 64
  num_workers: 0
  pin_memory: false
evaluation:
  selection_split: validation
  primary: ensemble_accuracy
dividemix:
  fidelity: official_cifar_v1
  model_count: 2
  initialization:
    peer_seed_offset: 1
  warmup:
    epochs: 1
    confidence_penalty_weight: 1.0
  gmm:
    threshold: 0.5
    random_seed: 0
    max_iterations: 10
    tolerance: 0.01
    covariance_regularization: 0.0005
    minimum_mean_separation: 1.0e-06
    loss_history:
      name: official_auto
      high_noise_rate: 0.9
      window_epochs: 5
  mixmatch:
    augmentations: 2
    temperature: 0.5
    mixup_alpha: 4.0
    mixup_lambda_scope: minibatch
  objective:
    lambda_u: 25.0
    lambda_r: 1.0
    rampup_epochs: 16
  training:
    epochs: 2
  inference:
    ensemble: official_logits_sum
trainer:
  device: cpu
execution:
  runner: dividemix
