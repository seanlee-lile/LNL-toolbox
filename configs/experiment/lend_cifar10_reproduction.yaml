schema_version: 1
kind: experiment
method: lend
execution:
  runner: lend
configuration_fidelity: paper_oriented
seed: 1
output_root: artifacts/reproductions/lend-cifar10-sym40
data:
  name: cifar10
  validation_size: 5000
  validation_split:
    strategy: stratified
    rng: default_rng
  augment: true
  preprocessing: standard
noise:
  name: symmetric
  rate: 0.4
  seed: 1
  sampling: transition
  rng: default_rng
  validation_targets: noisy
  manifest_filename: noise_manifest.npz
loader:
  batch_size: 256
  num_workers: 4
  pin_memory: true
  drop_last: false
model:
  name: resnet18
  base_width: 64
loss:
  name: ce
optimizer:
  name: sgd
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005
scheduler:
  name: multistep
  milestones:
  - 100
  gamma: 0.1
lend:
  graph:
    k: 8
    gamma: 1.0
    metric: inner_product
    normalize_features: false
  dilution:
    alpha: 0.99
    policy: fixed_steps
    steps: 10
  history:
    beta: 0.9
    first_observation: current
  selection:
    rule: noisy_equals_diluted_argmax
    reduction: batch_mean
    empty_batch: skip_update
  training:
    epochs: 200
evaluation:
  selection_split: validation
  primary: accuracy
trainer:
  device: auto
