method: lend
execution: {runner: lend}
seed: 1
output_root: artifacts/reproductions/lend-cifar10-symmetric04
data: {name: cifar10, root: data/cifar10, validation_size: 5000, split_strategy: stratified, split_rng: default_rng, augment: true}
noise: {name: symmetric, rate: 0.4, seed: 1, sampling: per_class, rng: default_rng, validation_targets: noisy}
loader: {batch_size: 128, num_workers: 4, pin_memory: true, drop_last: false}
model: {name: resnet18, base_width: 16}
optimizer: {name: sgd, lr: 0.1, momentum: 0.9, weight_decay: 0.0005}
scheduler: {name: multistep, milestones: [100], gamma: 0.1}
lend:
  graph: {k: 8, gamma: 1.0, metric: inner_product, normalize_features: false, zero_degree_policy: error}
  dilution: {alpha: 0.99, policy: fixed_steps, steps: 10}
  history: {beta: 0.9, first_observation: current}
  selection: {rule: noisy_equals_diluted_argmax, reduction: paper_sum, empty_batch: skip_update}
  training: {epochs: 200}
evaluation: {selection_split: validation, primary: accuracy}
trainer: {device: cuda}
