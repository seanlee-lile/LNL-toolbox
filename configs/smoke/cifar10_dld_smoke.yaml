schema_version: 1
kind: experiment
method: dld
execution:
  runner: dld
seed: 37
data:
  name: cifar10
  validation_size: 100
  max_train_samples: 128
  max_validation_samples: 64
  max_test_samples: 64
loader:
  batch_size: 32
  num_workers: 0
  pin_memory: false
noise:
  name: symmetric
  rate: 0.2
  seed: 41
  validation_targets: noisy
dld:
  fidelity:
    name: paper_oriented_v2_cosine_similarity
    hard_y0: averaged_views
    direction_endpoint: estimated_yn
    direction: yn_minus_y0
    neighbor_metric: cosine_similarity
    neighbor_weighting: inverse_neighbor_value
    self_neighbor: include
    divergence: kl_ps_to_pw
    divergence_softmax: false
    hard_yn_zero_denominator: fail
    schedule: average
    inference_initialization: zero
    inference_steps: 5
  feature_extractor:
    source: repository_frozen_model
    model:
      name: tiny_cnn
      width: 8
  precorrection:
    k_neighbors: 10
    delta: 1.0e-06
    gmm_components: 2
    gmm_seed: 0
    minimum_mean_separation: 0.0
  diffusion:
    timesteps: 20
    epochs: 2
    model:
      independent_predictors: true
      hidden_dim: 32
      time_dim: 8
    optimizer:
      direction:
        name: adam
        lr: 0.0001
      noise:
        name: adam
        lr: 0.0001
    scheduler:
      direction:
        name: none
      noise:
        name: none
    ema:
      enabled: true
      decay: 0.999
  inference:
    steps: 5
    deterministic: true
    initialization: zero
evaluation:
  selection_split: validation
  primary: accuracy
trainer:
  device: cpu
output_root: artifacts/runs
