  validation_targets: noisy
model:
  name: cnn9
  variant: standard
  weights: none
  batch_norm_momentum: 0.1
optimizer:
  name: adam
  lr: 0.001
  weight_decay: 0.0
scheduler:
  name: linear_after
  start_epoch: 80
  end_epoch: 200
  beta1_before: 0.9
  beta1_after: 0.1
