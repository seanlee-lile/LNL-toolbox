kind: experiment
schema_version: 1
method: coteaching
execution:
  runner: coteaching
configuration_fidelity: engineering
seed: 1
output_root: artifacts/reproductions/coteaching-cifar100-best
data:
  name: cifar100
  validation_size: 5000
  validation_split:
    strategy: stratified
    rng: default_rng
    source: training_pool
  augment: false
  preprocessing: tensor_only
