kind: experiment
schema_version: 1
method: ca2c
execution:
  runner: ca2c
seed: 1
output_root: artifacts/reproductions/ca2c-cifar10-best
data:
  name: cifar10
  validation_size: 300
  augment: true
  strong_augment: true
  strong_magnitude: 10
  num_classes: 10
  validation_split:
    source: training_pool
noise:
  rate: 0.2
  seed: 1
  sampling: per_class
  rng: default_rng
  name: symmetric
loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true
  drop_last: true
model:
  name: ca2c_seven_cnn
  variant: standard
  weights: none
optimizer:
  name: sgd
  lr: 0.01
  momentum: 0.9
  nesterov: true
  weight_decay: 0.0005
scheduler:
  name: cosine
  t_max: 700
  eta_min: 0.0
ca2c:
  warmup_epochs: 400
  candidate_k: 2
  lambda: 0.99
  robust_weight: 0.8
  warmup_early_stopping: false
trainer:
  epochs: 700
  device: auto
  early_stopping: false
