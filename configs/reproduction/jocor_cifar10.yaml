algorithm:
  estimated_noise_rate: 0.5
  lambda: 0.9
  name: jocor
data:
  augment: false
  name: cifar10
  preprocessing: tensor_only
  validation_size: 300
  validation_split:
    source: training_pool
evaluation:
  allow_test_selection: false
  report_last_epochs: 10
  selection_split: none
execution:
  runner: multi_model
kind: experiment
loader:
  batch_size: 128
  drop_last: true
  num_workers: 4
  pin_memory: true
loss:
  name: ce
models:
- batch_norm_momentum: 0.1
  name: cifar_six_conv
- batch_norm_momentum: 0.1
  name: cifar_six_conv
noise:
  name: symmetric
  rate: 0.5
  rng: numpy_legacy
  sampling: transition
  seed: 1
optimizer:
  betas:
  - 0.9
  - 0.999
  lr: 0.001
  name: adam
  weight_decay: 0.0
output_root: artifacts/reproductions/jocor-cifar10-best
parameter_sampling:
  candidates:
    setting:
    - lambda: 0.9
      noise: symmetric
      rate: 0.2
    - lambda: 0.9
      noise: symmetric
      rate: 0.5
    - lambda: 0.65
      noise: symmetric
      rate: 0.8
    - lambda: 0.9
      noise: asymmetric
      rate: 0.4
    train_seed:
    - 1
  paper: jocor
  seed: 20260728
  sources:
    setting: CVPR 2020 paper and official JoCoR README
    train_seed: official main.py default
scheduler:
  beta1_after: 0.1
  beta1_before: 0.9
  end_epoch: 200
  final_lr: 0.0
  initial_lr: 0.001
  name: linear_decay
  start_epoch: 80
schema_version: 1
seed: 1
selector:
  keep_rate:
    end: 0.5
    name: linear
    start: 1.0
    warmup_epochs: 9
  name: small_loss
  rounding: floor
trainer:
  device: auto
  early_stopping: false
  epochs: 200
  progress:
    curves: true
    enabled: true
    update_interval: 50
parameter_record:
  paper: jocor
  sampling_seed: 20260728
  parameters:
    setting:
      lambda: 0.9
      noise: symmetric
      rate: 0.5
    train_seed: 1
  candidates:
    setting:
    - lambda: 0.9
      noise: symmetric
      rate: 0.2
