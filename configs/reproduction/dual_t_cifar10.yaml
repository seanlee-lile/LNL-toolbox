kind: experiment
schema_version: 1
method: dual_t
seed: 1
output_root: artifacts/reproductions/dual-t-cifar10-best
data:
  name: cifar10
  validation_size: 10000
  augment: true
  preprocessing: standard
  validation_split:
    source: training_pool
noise:
  name: symmetric
  rate: 0.2
  seed: 1
  validation_targets: noisy
  manifest_filename: noise_manifest.npz
loader:
  batch_size: 128
  num_workers: 0
  pin_memory: true
trainer:
  device: auto
evaluation:
  selection_split: validation
posterior_stage:
  epochs: 100
  checkpoint_selection: noisy_validation_accuracy
  model:
    name: resnet18
    weights: none
    base_width: 64
    variant: imagenet_standard
  loss:
    name: ce
  optimizer:
    name: sgd
    lr: 0.01
    momentum: 0.0
    nesterov: false
    weight_decay: 0.0001
  scheduler:
    name: multistep
    milestones:
    - 50
    gamma: 0.1
  early_stopping: false
transition_stage: {}
final_stage:
  classifier: forward
  epochs: 200
  fresh_model: true
  model:
    name: resnet18
    weights: none
    base_width: 64
    variant: imagenet_standard
  loss:
    name: ce
  optimizer:
    name: sgd
    lr: 0.01
    momentum: 0.0
    nesterov: false
    weight_decay: 0.0001
  scheduler:
    name: multistep
    milestones:
    - 50
    - 100
    - 150
    gamma: 0.1
  early_stopping: false
execution:
  runner: dual_t
