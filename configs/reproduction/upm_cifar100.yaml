kind: experiment
schema_version: 1
method: upm
execution:
  runner: upm
configuration_fidelity: engineering
seed: 1
data:
  name: cifar100
  validation_size: 5000
  split_strategy: stratified
  split_rng: default_rng
  augment: true
  normalization:
    mean:
    - 0.5071
    - 0.4867
    - 0.4408
    std:
    - 0.2675
    - 0.2565
    - 0.2761
  max_train_samples: null
  max_test_samples: null
  max_validation_samples: null
  num_classes: 100
loader:
  batch_size: 256
  num_workers: 4
  pin_memory: true
  drop_last: false
noise:
  name: external_torch
  path: data/upm-cifar100-mlp/labels.pt
  clean_key: clean_label_train
  noisy_key: noise_label_train
  seed: 1
  validation_targets: noisy
upm:
  stage1:
    epochs: 160
    model:
      name: resnet32
      base_width: 16
    optimizer:
      name: sgd
      lr: 0.05
      momentum: 0.9
      weight_decay: 0.0001
    scheduler:
      name: multistep
      milestones:
      - 40
      - 80
      - 120
      gamma: 0.1
    best_metric: noisy_validation_accuracy
  psi:
    source: stage1_last
    split: train
    augmentation: false
  main:
    epochs: 160
    initialization: fresh
    model:
      name: resnet32
      base_width: 16
    optimizer:
      name: sgd
      lr: 0.05
      momentum: 0.9
      weight_decay: 0.0001
    scheduler:
      name: multistep
      milestones:
      - 40
      - 80
      - 120
      gamma: 0.1
  confusing_probability:
    initial_value: 0.01
    learning_rate: 0.5
    epsilon: 0.0001
    update_start_epoch: 35
    update_interval_epochs: 5
evaluation:
  selection_split: validation
  primary: accuracy
trainer:
  device: cuda
output_root: artifacts/reproductions/upm-cifar100-best
