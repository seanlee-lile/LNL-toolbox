kind: experiment
schema_version: 1
method: cal
execution:
  runner: cal
seed: 10086
output_root: artifacts/reproductions/cal-cifar10-best
data:
  name: cifar10
  validation_size: 300
  augment: true
  normalization:
    mean:
    - 0.4914
    - 0.4882
    - 0.4465
    std:
    - 0.2023
    - 0.1994
    - 0.201
  num_classes: 10
  validation_split:
    source: training_pool
