kind: experiment
schema_version: 1
method: t_revision
execution:
  runner: t_revision
configuration_fidelity: paper_oriented
seed: 1
output_root: artifacts/reproductions/t-revision-cifar10-best
data:
  name: cifar10
  validation_size: 5000
  preprocessing: standard
  augment: true
  normalization:
    mean:
    - 0.4914
    - 0.4822
    - 0.4465
    std:
    - 0.2023
    - 0.1994
    - 0.201
  validation_split:
    source: training_pool
noise:
  name: symmetric
  rate: 0.2
  sampling: transition
  seed: 1
  validation_targets: noisy
loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true
trainer:
  device: auto
t_revision:
  objective: reweight
  fidelity: paper_experiment_raw_additive
  stage1:
    epochs: 20
    model:
      name: resnet18
      variant: standard
      weights: none
      base_width: 64
      stem_padding: 0
      initialization: torch_default
    optimizer:
      name: sgd
      lr: 0.01
      momentum: 0.0
      weight_decay: 0.0001
    scheduler:
      name: none
    best_metric: noisy_validation_accuracy
    early_stopping: false
  transition_initialization:
    method: pseudo_anchor_percentile
    percentile: 97
    posterior_split: train
    extraction_augmentation: false
    tie_break: stable_sample_index
  classifier_initialization:
    epochs: 200
    optimizer:
      name: sgd
      lr: 0.01
      momentum: 0.9
      weight_decay: 0.0001
    scheduler:
      name: multistep
      milestones:
      - 40
      - 80
      gamma: 0.1
    start_from: stage1_best
    best_metric: revised_noisy_validation_accuracy
    early_stopping: false
  revision:
    epochs: 200
    transition_mode: paper_experiment_raw_additive
    delta_initialization: zeros
    start_from: classifier_initialization_best
    optimizer:
      name: adam
      lr: 5.0e-07
      weight_decay: 0.0001
    scheduler:
      name: none
    ratio:
      detach: false
      clamp: none
      denominator_floor: 1.0e-12
    best_metric: revised_noisy_validation_accuracy
    early_stopping: false
evaluation:
  selection_split: validation
