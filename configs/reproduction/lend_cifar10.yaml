kind: experiment
schema_version: 1
method: lend
execution:
  runner: lend
configuration_fidelity: paper_oriented
seed: 1
output_root: artifacts/reproductions/lend-cifar10-best
data:
  name: cifar10
  validation_size: 0
  validation_split:
    strategy: stratified
    rng: default_rng
  augment: true
  preprocessing: standard
noise:
  manifest: data/lend/cifar10-best-noise-manifest.npz
  validation_targets: none
  manifest_filename: noise_manifest.npz
  mode: external
  source_manifest_sha256: 93b0fc2119ca303b4e38eec20e66bec847ecdaa25393a0b665653f841fac08eb
loader:
  batch_size: 256
  num_workers: 4
  pin_memory: true
  drop_last: false
model:
  name: resnet18
  base_width: 64
loss:
  name: ce
optimizer:
  name: sgd
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005
scheduler:
  name: multistep
  milestones:
  - 100
  gamma: 0.1
lend:
  graph:
    k: 8
    gamma: 1.0
    metric: inner_product
    normalize_features: true
  dilution:
    alpha: 0.99
    policy: fixed_steps
    steps: 10
    tolerance: 1.0e-05
    max_steps: 10000
  history:
    beta: 0.9
    first_observation: current
  selection:
    rule: noisy_equals_diluted_argmax
    reduction: batch_mean
    empty_batch: zero_gradient
  training:
    epochs: 200
evaluation:
  selection_split: none
  primary: accuracy
trainer:
  device: cuda
