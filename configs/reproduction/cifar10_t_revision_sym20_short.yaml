schema_version: 1
kind: experiment
method: t_revision
execution:
  runner: t_revision
configuration_fidelity: engineering
seed: 1
output_root: artifacts/runs
data:
  name: cifar10
  validation_size: 5000
  preprocessing: standard
  augment: true
noise:
  name: symmetric
  rate: 0.2
  sampling: transition
  seed: 1
  validation_targets: noisy
loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true
trainer:
  device: auto
t_revision:
  objective: reweight
  fidelity: paper_experiment_raw_additive
  stage1:
    epochs: 15
    model:
      name: resnet18
      base_width: 64
    optimizer:
      name: sgd
      lr: 0.01
      momentum: 0.0
      weight_decay: 0.0001
    scheduler:
      name: none
    best_metric: noisy_validation_accuracy
  transition_initialization:
    method: pseudo_anchor_max_posterior
    posterior_split: train
    extraction_augmentation: false
    tie_break: stable_sample_index
  classifier_initialization:
    epochs: 15
    optimizer:
      name: sgd
      lr: 0.01
      momentum: 0.9
      weight_decay: 0.0001
    scheduler:
      name: multistep
      milestones:
      - 40
      - 80
      gamma: 0.1
    start_from: stage1_best
    best_metric: revised_noisy_validation_accuracy
  revision:
    epochs: 20
    transition_mode: paper_experiment_raw_additive
    delta_initialization: zeros
    start_from: classifier_initialization_best
    optimizer:
      name: adam
      lr: 5.0e-07
      weight_decay: 0.0001
    scheduler:
      name: none
    ratio:
      detach: false
      clamp: none
      denominator_floor: 1.0e-12
    best_metric: revised_noisy_validation_accuracy
evaluation:
  selection_split: validation
