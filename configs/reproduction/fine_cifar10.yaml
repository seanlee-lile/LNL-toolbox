kind: experiment
schema_version: 1
seed: 23
output_root: artifacts/reproductions/fine-cifar10-best
data:
  name: cifar10
  validation_size: 300
  augment: true
  strong_policy: official_cifar10
  normalization:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
  num_classes: 10
  validation_split:
    source: training_pool
noise:
  name: symmetric
  rate: 0.2
  seed: 23
  sampling: transition
  rng: numpy_legacy
loader:
  batch_size: 128
  num_workers: 8
  pin_memory: true
  drop_last: false
evaluation:
  batch_size: 16
model:
  name: fine_seven_cnn
  base_width: 64
  dropout: 0.25
optimizer:
  name: sgd
  lr: 0.05
  momentum: 0.9
  nesterov: true
  weight_decay: 0.0005
scheduler:
  name: cosine
  eta_min: 0.0005
trainer:
  epochs: 300
  device: auto
  early_stopping: false
fine:
  warmup_epochs: 200
  warmup_lr: 0.1
  ema_momentum: 0.95
  momentum_scs: 0.999
  momentum_scr: 0.99
  maximum_threshold: 0.95
  alpha: 1.0
  beta: 0.001
  gamma: 0.1
  probability_floor: 1.0e-07
  warmup_early_stopping: false
parameter_record:
  sampling_seed: 23
  selected_group: cifar100_symmetric_02
  source: paper_equations_with_author_sed_training
  repeated_runs: 1
execution:
  runner: fine
